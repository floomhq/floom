schema_version: '0.3'
name: schedule-test
title: Schedule Test Worker
description: Fires every minute for testing the cron scheduler. Change cron expression to desired schedule after testing.
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
limits:
  max_tool_iterations: 12
  max_output_tokens: 4096
  max_total_tokens: 50000
  timeout_seconds: 300
exec:
  mode: pure-script
  command: python run.py
  runtime: python311
  runner: local
  inputs: []
  secrets: []
  outputs:
  - name: message
    kind: scalar
    type: string
    required: true
    label: Scheduled Message
capabilities:
  secrets: []
  network:
    egress: false
approvals:
  required: false
trigger:
  type: schedule
  cron: '* * * * *'
