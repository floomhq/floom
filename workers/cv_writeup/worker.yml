schema_version: '0.3'
is_example: true
name: cv-writeup
title: CV Reformat + Writeup
description: Parse a candidate CV (PDF/DOCX/TXT), extract structured profile, and generate a branded NovaSearch submission
  writeup.
long_description: |
  Turns a raw candidate CV into a client-ready NovaSearch submission pack. It extracts the profile, aligns the candidate against the client brief, and produces a polished writeup recruiters can review before sending.
use_cases:
- Prepare a branded candidate submission from an uploaded CV.
- Extract skills, seniority, availability, and compensation signals into JSON.
- Adapt the same profile for a different client or role brief.
example_input:
  cv_file: |
    Anna Keller
    Senior Java Backend Engineer

    Experience
    - 8 years building Java, Spring Boot, Kafka, and microservice platforms.
    - Led payment reliability projects in regulated fintech environments.
    - Mentored backend teams and improved deployment observability.

    Skills
    Java, Spring Boot, Kafka, PostgreSQL, AWS, Docker, Kubernetes
  client_brief: 'Client: N26 Berlin. Role: Senior Java Backend Engineer. Must-haves: 5+ years Java, Spring Boot, Kafka, microservices. Nice-to-have: banking domain. Perm hire, EUR 90-110k.'
  target_format: branded_markdown
example_output: |
  ## Candidate writeup

  **Anna Keller** is a Senior Java Backend Engineer with 8 years of experience across Spring Boot, Kafka, and regulated fintech platforms.

  **Fit for N26:** Strong match on Java microservices, event-driven architecture, and banking-adjacent compliance work.

  **Submission note:** Position as a senior backend hire for platform reliability and payments-domain ownership.
how_it_works: |
  CV file + client brief
    -> extract structured candidate profile
    -> compare profile against must-haves
    -> generate branded writeup and JSON profile
    -> recruiter reviews before sending
folder: Recruiting/NovaSearch
tags:
- recruiting
- cv
- novasearch
- writeup
- candidate
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
limits:
  max_tool_iterations: 12
  max_output_tokens: 12000
  max_total_tokens: 50000
  timeout_seconds: 300
exec:
  command: python run.py
  runtime: python311
  runner: e2b
  inputs:
  - name: cv_file
    kind: file
    media_type: application/octet-stream
    accepts:
    - application/octet-stream
    - application/pdf
    - text/plain
    - application/msword
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    path: inputs/cv_file
    required: true
    label: CV file (PDF, DOCX, or TXT)
  - name: client_brief
    kind: scalar
    type: string
    required: true
    label: Client context (company, role, must-haves)
    placeholder: 'Client: N26 Berlin. Role: Senior Java Backend Engineer. Must-haves: 5+ years Java, microservices, ideally
      banking domain. Perm hire, €90-110k.'
  - name: target_format
    kind: scalar
    type: select
    required: true
    default: branded_markdown
    enum:
    - branded_markdown
    - plain_summary
    - two_pager
    label: Output format
    options:
    - branded_markdown
    - plain_summary
    - two_pager
  secrets:
  - OPENAI_API_KEY
  outputs:
  - name: writeup
    kind: file
    media_type: text/markdown
    path: out/writeup.md
    required: true
    label: Candidate Writeup
  - name: extracted_profile
    kind: file
    media_type: application/json
    path: out/extracted_profile.json
    required: true
    label: Extracted Profile (JSON)
  entry: run.py
capabilities:
  secrets:
  - OPENAI_API_KEY
  network:
    egress: true
approvals:
  required: false
  label: Review and approve candidate writeup before sending to client
trigger:
  type: manual
