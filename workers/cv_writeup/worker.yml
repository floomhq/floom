id: cv_writeup
name: CV Reformat + Writeup
description: Parse a candidate CV (PDF/DOCX/TXT), extract structured profile, and generate a branded Search Assistant submission writeup.

trigger:
  type: manual

runtime:
  type: python
  entrypoint: run.py
  runner: local

inputs:
  - name: cv_file
    label: CV file (PDF, DOCX, or TXT)
    type: file
    required: true

  - name: client_brief
    label: Client context (company, role, must-haves)
    type: textarea
    required: true
    placeholder: "Client: N26 Berlin. Role: Senior Java Backend Engineer. Must-haves: 5+ years Java, microservices, ideally banking domain. Perm hire, €90-110k."

  - name: target_format
    label: Output format
    type: select
    required: true
    options:
      - branded_markdown
      - plain_summary
      - two_pager
    default: branded_markdown

secrets:
  - OPENAI_API_KEY

outputs:
  - name: writeup
    label: Candidate Writeup
    type: markdown

  - name: extracted_profile
    label: Extracted Profile (JSON)
    type: json

approvals:
  required: true
  label: "Review and approve candidate writeup before sending to client"
