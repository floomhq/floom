schema_version: '0.3'
is_example: false
name: gmail-smart-replies
title: Gmail Smart Replies
description: Reads recent unread human emails and drafts on-brand replies as Gmail drafts in Federico's voice. Never sends.
long_description: |
  Fetches recent unread emails, skips automated/no-reply mail, and for each real
  human email that warrants a response, drafts a reply in Federico's voice using
  his brain context. Replies are saved as Gmail DRAFTS for review; the worker
  never sends. Triage/cleaning stays in the separate gmail-inbox-manager worker;
  this worker is the draft-reply layer on top.
use_cases:
- Draft on-brand replies to important unread emails before the workday starts.
- Turn a noisy inbox into a set of ready-to-review Gmail drafts.
- Preview suggested replies without saving them, to check tone before going live.
how_it_works: |
  Gmail unread search
    -> skip automated / no-reply senders
    -> for each human email, decide if a reply is warranted
    -> draft a reply in Federico's voice (platform model)
    -> save as a Gmail draft (never send)
    -> write a markdown summary of what was drafted
folder: Operations/Inbox
tags:
- gmail
- email
- drafts
- operations
version: 0.1.1
entrypoint: SKILL.md
targets:
- generic
entrypoints:
- name: main
  path: SKILL.md
  type: markdown
limits:
  max_tool_iterations: 20
  max_output_tokens: 20000
  max_total_tokens: 250000
  timeout_seconds: 300
exec:
  runtime: skill
  runner: e2b
  inputs:
  - name: max_threads
    kind: scalar
    type: string
    required: false
    default: "3"
    label: Max threads
    description: How many recent emails to consider this run.
  - name: query
    kind: scalar
    type: string
    required: false
    default: "in:inbox is:unread"
    label: Gmail search query
  - name: create_drafts
    kind: scalar
    type: select
    required: false
    default: "false"
    enum:
    - "true"
    - "false"
    label: Create drafts
    description: false = preview drafts in the summary only. true = also save them as Gmail drafts (never sends).
  outputs:
  - name: summary
    kind: file
    media_type: text/markdown
    path: out/summary.md
    required: true
    label: Draft summary
  entry: SKILL.md
capabilities:
  network:
    egress: true
approvals:
  required: false
  label: Approve drafts
trigger:
  type: manual
connections:
- app: gmail
  allowed_tools:
  - GMAIL_FETCH_EMAILS
  - GMAIL_CREATE_EMAIL_DRAFT
contexts:
- name: federico-ops
  writeable: false
