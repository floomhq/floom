schema_version: "0.3"
is_example: true
archived: true
archive_reason: "Paused — needs the customer's Notion, Linear, and Slack accounts connected before it can run."
name: kugelaudio-meeting-pipeline
title: Kugelaudio Meeting Pipeline
description: Notion Meeting Tracker -> Claude extraction -> Linear issues (dedupe + create) -> Slack digest -> Notion state writeback.
long_description: |
  Real customer workflow from Kugelaudio. Scans a Notion database for rows
  where the `Team Meeting` trigger checkbox is enabled, flattens the page
  body into meeting text, fetches the team's open Linear issues, uses
  Claude (Haiku) to extract action items with optional matches to existing
  issues, creates new issues or adds comments to matched ones, posts a
  Slack digest, and writes the run state + identifiers back to Notion.

  This bundle currently ships ONLY the design/runbook (SKILL.md). The
  customer's JavaScript implementation (`meeting-pipeline.js` +
  `meeting-pipeline-run-once.js`) lives in their own repo. To make this
  runnable on Workeros, drop the customer's source into `run.js` and add
  the Node deps (`@notionhq/client`, `@anthropic-ai/sdk`) to package.json.
use_cases:
- Convert ad-hoc team meetings into tracked Linear issues with no manual transcription.
- Keep Notion meeting pages, Linear board, and Slack channel in sync after every standup.
- Schedule a 15-minute cadence so new meeting notes get picked up automatically.
folder: Operations/Meetings
tags:
- notion
- linear
- slack
- anthropic
- meetings
- node
version: 0.1.0
targets:
- generic
limits:
  max_tool_iterations: 6
  max_output_tokens: 8000
  max_total_tokens: 100000
  timeout_seconds: 600
exec:
  entry: SKILL.md
  runtime: skill
  runner: e2b
  inputs:
  - name: dry_run
    kind: scalar
    type: boolean
    required: false
    default: true
    label: Dry run (no Linear/Slack/Notion writes)
  outputs:
  - name: summary
    kind: file
    media_type: application/json
    path: out/summary.json
    required: true
    label: Run summary (JSON)
  secrets:
  - NOTION_API_KEY
  - SLACK_BOT_TOKEN
  - LINEAR_API_KEY
  - LINEAR_TEAM_ID
  - ANTHROPIC_API_KEY
capabilities:
  secrets:
  - NOTION_API_KEY
  - SLACK_BOT_TOKEN
  - LINEAR_API_KEY
  - LINEAR_TEAM_ID
  - ANTHROPIC_API_KEY
  network:
    egress: true
approvals:
  required: false
trigger:
  type: schedule
  cron: "*/15 * * * *"
  timezone: "Europe/Berlin"
