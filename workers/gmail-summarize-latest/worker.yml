schema_version: "0.3"
name: "gmail-summarize-latest"
title: "Gmail Summarize Latest"
description: "Summarizes the most recent Gmail inbox message with sender, subject, date, and action items"
long_description: "Reads the latest message from your Gmail inbox, extracts the key metadata and full body text, then produces a concise 2-3 sentence summary. The result is returned as structured JSON with any action items listed separately."
use_cases:
  - "Quickly understand the newest inbox email."
  - "Capture follow-up tasks from recent messages."
  - "Feed latest email context into another workflow."
example_input: {}
example_output: "{\n  \"subject\": \"Project timeline update\",\n  \"from\": \"Alex Rivera <alex@example.com>\",\n  \"date\": \"Tue, 18 Jun 2026 09:15:00 -0700\",\n  \"summary\": \"Alex shared an updated project timeline and noted that the launch date has moved to July 10. The email asks the team to review the revised milestones and confirm availability for next week's planning call.\",\n  \"action_items\": [\"Review the revised milestones\", \"Confirm availability for next week's planning call\"]\n}"
how_it_works: "Fetch latest Gmail inbox message -> fetch full message details -> extract metadata and body -> summarize with action items -> write JSON output"
folder: "Operations/Reporting"
tags:
  - "gmail"
  - "summary"
  - "json"
  - "on-demand"
  - "email"
version: "0.1.0"
is_example: false
trigger:
  type: "manual"
limits:
  max_output_tokens: 64000
connections:
  - app: "gmail"
    allowed_tools:
      - "GMAIL_FETCH_EMAILS"
      - "GMAIL_FETCH_MESSAGE_BY_MESSAGE_ID"
exec:
  entry: "SKILL.md"
  runtime: "skill"
  runner: "e2b"
  inputs: []
  outputs:
    - name: "result"
      kind: "file"
      media_type: "application/json"
      path: "out/result.json"
      required: true
      label: "Email Summary JSON"