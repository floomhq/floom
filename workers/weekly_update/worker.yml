schema_version: '0.3'
is_example: true
name: weekly-update
title: Weekly Update
description: Turns raw notes into a polished weekly company update using AI.
long_description: |
  Converts rough weekly notes into a polished update for internal, investor, or customer audiences. It keeps the structure consistent while adjusting tone and emphasis for the selected audience.
use_cases:
- Turn messy founder notes into an internal Friday update.
- Prepare an investor-facing progress memo from product and revenue bullets.
- Rewrite operational updates into a customer-safe changelog style.
example_input:
  notes: |
    - Launched worker description metadata
    - Added Gmail intake prototype
    - 12 customer calls, 4 asked for visual examples
    - Next week: polish folder tree and approval UX
  audience: investor
example_output: |
  # Weekly update

  ## Highlights

  - Shipped worker description metadata to make automation behavior easier to trust.
  - Validated Gmail intake demand through early prototype testing.
  - Completed 12 customer calls; 4 explicitly requested clearer visual examples.

  ## Next week

  Focus on folder navigation and approval-flow polish.
how_it_works: |
  Raw notes + audience
    -> group bullets by theme
    -> rewrite for audience tone
    -> highlight metrics and next steps
    -> return approval-ready markdown
folder: Operations/Reporting
tags:
- updates
- reporting
- markdown
- operations
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
entrypoints:
- name: main
  path: SKILL.md
  type: markdown
limits:
  max_tool_iterations: 12
  max_output_tokens: 4096
  max_total_tokens: 50000
  timeout_seconds: 300
exec:
  runtime: skill
  runner: e2b
  inputs:
  - name: notes
    kind: scalar
    type: string
    required: true
    label: Raw notes
    placeholder: Paste notes, bullets, metrics, updates...
  - name: audience
    kind: scalar
    type: select
    required: true
    default: internal
    enum:
    - internal
    - investor
    - customer
    label: Audience
    options:
    - internal
    - investor
    - customer
  outputs:
  - name: update
    kind: file
    media_type: text/markdown
    path: out/update.md
    required: true
    label: Weekly update
  entry: SKILL.md
capabilities:
  secrets: []
  network:
    egress: true
approvals:
  required: false
  label: Approve final update
trigger:
  type: manual
