schema_version: '0.3'
name: weekly-update
title: Weekly Update
description: Turns raw notes into a polished weekly company update using AI.
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
entrypoints:
- name: main
  path: SKILL.md
  type: markdown
limits:
  max_tool_iterations: 12
  max_output_tokens: 4096
  max_total_tokens: 50000
  timeout_seconds: 300
exec:
  mode: agent
  command: python run.py
  runtime: python311
  runner: local
  inputs:
  - name: notes
    kind: scalar
    type: string
    required: true
    label: Raw notes
    placeholder: Paste notes, bullets, metrics, updates...
  - name: audience
    kind: scalar
    type: select
    required: true
    default: internal
    enum:
    - internal
    - investor
    - customer
    label: Audience
    options:
    - internal
    - investor
    - customer
  secrets:
  - OPENAI_API_KEY
  outputs:
  - name: update
    kind: file
    media_type: text/markdown
    path: out/update.md
    required: true
    label: Weekly update
capabilities:
  secrets:
  - OPENAI_API_KEY
  network:
    egress: true
approvals:
  required: false
  label: Approve final update
trigger:
  type: manual
