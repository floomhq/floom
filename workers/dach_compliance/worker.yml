schema_version: '0.3'
name: dach-compliance
title: DACH Compliance + Rate Benchmark
description: AÜG risk assessment, Scheinselbständigkeit check, and DACH market rate benchmark for contractor engagements.
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
limits:
  max_tool_iterations: 12
  max_output_tokens: 4096
  max_total_tokens: 50000
  timeout_seconds: 300
exec:
  mode: pure-script
  command: python run.py
  runtime: python311
  runner: local
  inputs:
  - name: engagement_type
    kind: scalar
    type: select
    required: true
    default: AÜG
    enum:
    - AÜG
    - Werkvertrag
    - Dienstvertrag
    - Festanstellung
    label: Engagement type
    options:
    - AÜG
    - Werkvertrag
    - Dienstvertrag
    - Festanstellung
  - name: role_summary
    kind: scalar
    type: string
    required: true
    label: Role summary + tech stack
    placeholder: Senior Java Backend Engineer, microservices, Spring Boot, Kafka. Working embedded in client's engineering
      team in Berlin. Expected 12 months.
  - name: proposed_daily_rate_eur
    kind: scalar
    type: number
    required: false
    label: Proposed daily rate (EUR, optional)
    placeholder: '750'
  - name: location
    kind: scalar
    type: string
    required: false
    default: Remote DACH
    label: Location
    placeholder: Berlin, Germany
  - name: experience_years
    kind: scalar
    type: number
    required: true
    label: Years of experience
    placeholder: '7'
  secrets:
  - OPENAI_API_KEY
  outputs:
  - name: compliance_report
    kind: file
    media_type: text/markdown
    path: out/compliance_report.md
    required: true
    label: Compliance Report
  - name: rate_benchmark
    kind: file
    media_type: text/markdown
    path: out/rate_benchmark.md
    required: true
    label: Rate Benchmark
  - name: red_flags
    kind: file
    media_type: application/json
    path: out/red_flags.json
    required: true
    label: Red Flags (JSON)
    json_required_keys:
    - risk_level
    - items
capabilities:
  secrets:
  - OPENAI_API_KEY
  network:
    egress: true
approvals:
  required: false
trigger:
  type: manual
