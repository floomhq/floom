schema_version: '0.3'
name: research-brief
title: Research Brief
description: Generates a markdown research brief on any topic.
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
exec:
  command: python run.py
  runtime: python311
  runner: local
  inputs:
  - name: topic
    kind: scalar
    type: string
    required: true
    label: Research topic
    placeholder: e.g. "Competitor analysis for AI CRM tools"
  - name: audience
    kind: scalar
    type: select
    required: true
    default: executive
    enum:
    - executive
    - technical
    - sales
    label: Audience
    options:
    - executive
    - technical
    - sales
  - name: depth
    kind: scalar
    type: select
    required: true
    default: overview
    enum:
    - overview
    - detailed
    - deep_dive
    label: Depth
    options:
    - overview
    - detailed
    - deep_dive
  secrets:
  - OPENAI_API_KEY
  outputs:
  - name: brief
    kind: file
    media_type: text/markdown
    path: out/brief.md
    required: true
    label: Research brief
capabilities:
  secrets:
  - OPENAI_API_KEY
  network:
    egress: true
approvals:
  required: false
  label: Approve research brief
trigger:
  type: manual
