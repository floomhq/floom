schema_version: "0.3"
name: "gmail-meeting-approval"
title: "Gmail Meeting Approval"
description: "Scans recent Gmail messages for meeting requests and creates approved Calendar events"
long_description: "Scans the 10 most recent Gmail inbox messages, identifies likely meeting requests, and asks for approval before creating any Google Calendar event."
use_cases:
  - "Review meeting requests before adding them to Calendar"
  - "Turn email scheduling requests into approved calendar events"
  - "Keep a clear audit trail of approvals and created events"
example_input: {}
folder: "Operations/Reporting"
tags:
  - "gmail"
  - "calendar"
  - "approval"
version: "0.1.0"
is_example: false
trigger:
  type: "manual"
limits:
  max_tool_iterations: 40
  timeout_seconds: 600
connections:
  - app: "gmail"
    allowed_tools:
      - "GMAIL_FETCH_EMAILS"
      - "GMAIL_FETCH_MESSAGE_BY_MESSAGE_ID"
  - app: "googlecalendar"
    allowed_tools:
      - "GOOGLECALENDAR_CREATE_EVENT"
exec:
  entry: "SKILL.md"
  runtime: "skill"
  runner: "e2b"
  inputs: []
  outputs:
    - name: "result"
      kind: "file"
      media_type: "application/json"
      path: "out/result.json"
      required: true
      label: "Approval Summary"
