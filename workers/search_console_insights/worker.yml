schema_version: '0.3'
is_example: false
name: search-console-insights
title: Search Console Insights
description: Weekly SEO audit via Google Search Console that compares 28-day performance windows and surfaces concrete ranking, CTR, and diagnostics opportunities.
long_description: |
  Pulls Search Console performance data for a verified site, compares current and previous periods, identifies query/page opportunities, optionally runs URL diagnostics, and writes markdown SEO reports into the worker outputs.
use_cases:
- Find page-two queries that can be pushed into the top results.
- Detect pages with traffic or CTR decay before they become invisible.
- Produce a weekly SEO action report for founders or marketing operators.
example_input:
  site_url: "https://rocketlist.ai/"
  run_diagnostics: true
example_output: |
  # SEO Action Report

  ## CTR opportunities

  - Query with 1,200 impressions and 1.8% CTR
  - Page-two term averaging position 11.4

  ## Diagnostics

  - Sitemap reachable
  - Key landing page indexed
how_it_works: |
  Google Search Console connection
    -> fetch search analytics for current and previous windows
    -> compare clicks, impressions, CTR, and position
    -> inspect selected URLs and sitemaps when requested
    -> write markdown reports and diagnostics artifacts
folder: Operations/SEO
tags:
- seo
- google-search-console
- diagnostics
- reporting
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
limits:
  max_tool_iterations: 16
  max_output_tokens: 16000
  max_total_tokens: 60000
  timeout_seconds: 420
exec:
  command: python run.py
  runtime: python311
  runner: e2b
  entry: run.py
  inputs:
  - name: site_url
    kind: scalar
    type: string
    required: true
    default: "https://rocketlist.ai/"
    label: Site URL
    placeholder: "https://example.com/"
  - name: run_diagnostics
    kind: scalar
    type: boolean
    required: false
    default: true
    label: Run URL diagnostics
  outputs:
  - name: seo_report
    kind: file
    media_type: text/markdown
    path: out/seo-report.md
    required: true
    label: SEO Action Report
  - name: diagnostics
    kind: file
    media_type: text/markdown
    path: out/diagnostics.md
    required: false
    label: GSC Diagnostics
capabilities:
  secrets: []
  network:
    egress: true
approvals:
  required: false
trigger:
  type: schedule
  cron: "0 9 * * 1"
connections:
- app: google_search_console
  allowed_tools:
  - GOOGLE_SEARCH_CONSOLE_SEARCH_ANALYTICS_QUERY
  - GOOGLE_SEARCH_CONSOLE_LIST_SITEMAPS
  - GOOGLE_SEARCH_CONSOLE_INSPECT_URL
contexts:
- name: rocketlist-seo-reports
  writeable: true
