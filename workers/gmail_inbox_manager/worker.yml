schema_version: '0.3'
is_example: true
name: gmail-inbox-manager
title: Gmail Inbox Manager
description: Daily Gmail cleaner that applies inbox rules, archives low-value messages, labels matching mail, and writes a markdown digest.
long_description: |
  Fetches unread and recent Gmail messages, applies local rule definitions when present, performs safe batch label updates through the Floom Composio proxy, and writes a daily inbox digest.
use_cases:
- Archive or mark routine inbox messages as read before the workday starts.
- Separate important unread mail from FYI messages in a daily digest.
- Apply configured Gmail labels to messages that match operating rules.
example_input: {}
example_output: |
  # Inbox Digest - Monday, June 1, 2026

  ## Auto-cleaned today

  | Count | Type |
  |-------|------|
  | 12 | Emails processed by rules |

  ## Important - needs attention (3)

  - Client renewal note
  - Founder intro request
  - Contractor invoice question
how_it_works: |
  Gmail unread/recent search
    -> parse sender, subject, labels, snippets
    -> match optional inbox rules
    -> call allowed Gmail Composio tools through the run-scoped proxy
    -> write a markdown digest artifact
folder: Operations/Inbox
tags:
- gmail
- inbox
- email
- operations
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
limits:
  max_tool_iterations: 12
  max_output_tokens: 12000
  max_total_tokens: 50000
  timeout_seconds: 300
exec:
  command: python run.py
  runtime: python311
  runner: e2b
  entry: run.py
  inputs: []
  secrets: []
  outputs:
  - name: summary
    kind: file
    media_type: text/markdown
    path: out/summary.md
    required: true
    label: Daily inbox digest
capabilities:
  secrets: []
  network:
    egress: true
approvals:
  required: false
trigger:
  type: schedule
  cron: "0 7 * * *"
connections:
- app: gmail
  allowed_tools:
  - GMAIL_FETCH_EMAILS
  - GMAIL_LIST_LABELS
  - GMAIL_BATCH_MODIFY_MESSAGES
