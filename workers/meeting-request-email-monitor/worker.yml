schema_version: "0.3"
name: "meeting-request-email-monitor"
title: "Meeting Request Email Monitor"
description: "Monitors Gmail for meeting requests and schedules approved events"
long_description: |
  Checks your Gmail inbox every 10 minutes for emails that look like meeting or scheduling requests.

  When it finds one, it extracts the requested time, attendees, purpose, and any missing details, then raises an approval before making calendar changes.

  If you approve the request, it creates the event on your connected Google Calendar. It will not send email replies.
use_cases:
  - "Catch meeting requests in Gmail without manually scanning your inbox."
  - "Review proposed calendar events before anything is added."
  - "Turn approved scheduling emails into Google Calendar events."
example_output: |
  ## Meeting Request Email Monitor
  - Emails checked: 12
  - Meeting requests found: 1
  - Approvals raised: 1
  - Calendar events created: 0 pending approval
how_it_works: |
  Scheduled run every 10 minutes
    -> search recent Gmail messages for scheduling intent
    -> extract meeting details and check calendar context
    -> raise an approval for any calendar action
    -> create the event only after approval
folder: "Productivity/Calendar"
tags:
  - "gmail"
  - "calendar"
  - "meetings"
  - "approval"
version: "0.1.0"
is_example: false
targets:
  - "generic"
limits:
  max_tool_iterations: 16
  max_output_tokens: 4096
  max_total_tokens: 50000
  timeout_seconds: 300
exec:
  mode: "agent"
  entry: "SKILL.md"
  runtime: "skill"
  runner: "e2b"
  inputs: []
  outputs:
    - name: "summary"
      kind: "file"
      media_type: "text/markdown"
      path: "out/summary.md"
      required: true
      label: "Run Summary"
trigger:
  type: "schedule"
  cron: "*/10 * * * *"
  timezone: "UTC"
approvals:
  required: true
connections:
  - "gmail"
  - "googlecalendar"
