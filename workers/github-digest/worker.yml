schema_version: "0.3"
is_example: true
name: "github-digest"
title: "GitHub Digest Sender"
description: "Every morning at 9am, send a digest of unread GitHub PRs and open issues."
version: "0.1.0"
targets: ["generic"]
exec:
  entry: "SKILL.md"
runtime: "skill"
runners: "e2b"
trigger:
  type: "schedule"
  cron: "0 9 * * *"
  timezone: "UTC"
outputs:
- name: "digest"
  kind: "file"
  media_type: "text/markdown"
  path: "out/digest.md"
  required: true
  label: "Daily Digest"
