schema_version: "0.3"
is_example: true
archived: true
archive_reason: "Paused — needs the customer's Slack, Linear, and Notion accounts connected before it can run."
name: kugelaudio-bug-intake
title: Kugelaudio Bug Intake
description: Scans ext-*-kugel Slack channels + a Gmail label for bug reports, classifies priority, opens Linear issues, posts alerts, syncs thread replies back as Linear comments.
long_description: |
  Real customer workflow from Kugelaudio. Polls Slack customer channels
  (pattern `ext-*-kugel`) and a configurable Gmail label for inbound bug
  reports, classifies them P1-P4 using German keyword heuristics (+
  optional Anthropic for Gmail), creates Linear issues with the resolved
  priority, posts alerts to per-priority Slack channels, optionally replies
  in-thread asking for repro steps, and mirrors new thread replies as
  comments on the Linear issue. State is persisted in a JSON file so each
  bug is processed once.

  This is a Node.js (ESM) worker — runs `node run.js`. Workeros installs
  `package.json` dependencies before execution.
use_cases:
- Triage customer Slack bugs automatically into Linear with the right priority.
- Pull bug reports out of a Gmail label into Linear using Anthropic for classification.
- Keep a Slack thread <-> Linear issue conversation alive without manual copy/paste.
folder: Operations/Support
tags:
- slack
- linear
- gmail
- bug-intake
- node
version: 0.1.0
targets:
- generic
limits:
  max_tool_iterations: 6
  max_output_tokens: 4096
  max_total_tokens: 50000
  timeout_seconds: 600
exec:
  command: node run.js
  runtime: node22
  runner: e2b
  entry: run.js
  inputs:
  - name: dry_run
    kind: scalar
    type: boolean
    required: false
    default: false
    label: Dry run (no Linear/Slack writes)
  outputs:
  - name: summary
    kind: file
    media_type: application/json
    path: out/summary.json
    required: true
    label: Run summary (JSON)
  secrets:
  - SLACK_BOT_TOKEN
  - LINEAR_API_KEY
  - LINEAR_TEAM_ID
  - ANTHROPIC_API_KEY
  - GMAIL_SERVICE_ACCOUNT_JSON
capabilities:
  secrets:
  - SLACK_BOT_TOKEN
  - LINEAR_API_KEY
  - LINEAR_TEAM_ID
  - ANTHROPIC_API_KEY
  - GMAIL_SERVICE_ACCOUNT_JSON
  network:
    egress: true
approvals:
  required: false
trigger:
  type: schedule
  cron: "*/15 * * * *"
  timezone: "Europe/Berlin"
