schema_version: '0.3'
is_example: true
name: opendraft
title: OpenDraft Research Paper
description: Runs the upstream OpenDraft engine end to end to generate a long-form academic draft with verified citation discovery and export artifacts.
long_description: |
  This worker bundles and runs the real federicodeponte/opendraft engine inside
  the Workeros E2B sandbox. It calls opendraft.generate.generate_draft directly,
  using the upstream research, architecture, writing, validation, and final
  compilation pipeline.

  The run uses GOOGLE_API_KEY from Workeros secrets, keeps network egress
  enabled for academic source discovery, writes the final markdown draft, saves
  the citation database when produced, attempts PDF and DOCX exports, and always
  includes an export report plus a zipped workspace so any missing export is
  visible instead of silently dropped.
use_cases:
- Generate a full academic research paper draft from a thesis question or topic.
- Produce a citation-backed literature review draft with intermediate workspace files preserved.
- Stress-test real long-running E2B worker execution with a heavyweight Python engine.
example_input:
  topic: The role of synthetic data in training small language models
  citation_style: APA 7th
  language: english
  export_pdf: true
  export_docx: true
example_output: |
  {
    "final_draft": "out/final_draft.md",
    "run_metadata": "out/run_metadata.json",
    "export_report": "out/export_report.json",
    "workspace_archive": "out/opendraft_workspace.zip"
  }
how_it_works: |
  Topic + citation style + language
    -> run the upstream OpenDraft generate_draft pipeline
    -> discover and validate academic citations through the bundled engine
    -> write the full final markdown draft
    -> attempt PDF and DOCX exports
    -> return metadata, export status, citation database, and workspace archive
folder: Research/Drafting
tags:
- research
- thesis
- opendraft
- academic
- citations
version: 0.2.0
entrypoint: run.py
targets:
- generic
entrypoints:
- name: main
  path: run.py
  type: python
limits:
  max_tool_iterations: 12
  max_output_tokens: 6144
  max_total_tokens: 60000
  timeout_seconds: 1200
exec:
  mode: pure-script
  command: python run.py
  runtime: python311
  runner: e2b
  entry: run.py
  inputs:
  - name: topic
    kind: scalar
    type: textarea
    required: true
    label: Research topic
    placeholder: e.g. "The role of synthetic data in training small language models"
  - name: citation_style
    kind: scalar
    type: select
    required: true
    default: APA 7th
    enum:
    - APA 7th
    - IEEE
    - Chicago
    - MLA
    label: Citation style
    options:
    - APA 7th
    - IEEE
    - Chicago
    - MLA
  - name: language
    kind: scalar
    type: select
    required: true
    default: english
    enum:
    - english
    - german
    - spanish
    - french
    label: Draft language
    options:
    - english
    - german
    - spanish
    - french
  - name: model_name
    kind: scalar
    type: string
    required: false
    label: Gemini model override
    placeholder: Leave blank to use OpenDraft default
  - name: enable_citation_verification
    kind: scalar
    type: boolean
    required: false
    default: true
    label: Run citation claim verification
  - name: export_pdf
    kind: scalar
    type: boolean
    required: false
    default: true
    label: Export PDF
  - name: export_docx
    kind: scalar
    type: boolean
    required: false
    default: true
    label: Export DOCX
  secrets:
  - GOOGLE_API_KEY
  outputs:
  - name: final_draft
    kind: file
    media_type: text/markdown
    path: out/final_draft.md
    required: true
    label: Final markdown draft
  - name: run_metadata
    kind: file
    media_type: application/json
    path: out/run_metadata.json
    required: true
    label: Run metadata
  - name: export_report
    kind: file
    media_type: application/json
    path: out/export_report.json
    required: true
    label: Export report
  - name: citation_database
    kind: file
    media_type: application/json
    path: out/citation_database.json
    required: false
    label: Citation database
  - name: workspace_archive
    kind: file
    media_type: application/zip
    path: out/opendraft_workspace.zip
    required: true
    label: Workspace archive
  - name: pdf
    kind: file
    media_type: application/pdf
    path: out/final_draft.pdf
    required: false
    label: PDF export
  - name: docx
    kind: file
    media_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document
    path: out/final_draft.docx
    required: false
    label: DOCX export
  - name: error_report
    kind: file
    media_type: application/json
    path: out/error_report.json
    required: false
    label: Error report
capabilities:
  secrets:
  - GOOGLE_API_KEY
  network:
    egress: true
approvals:
  required: false
  label: Approve research draft
trigger:
  type: manual
