schema_version: '0.3'
name: webhook-test
title: Webhook Test Worker
description: Triggered by incoming HTTP webhooks. Echoes the payload back.
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
limits:
  max_tool_iterations: 12
  max_output_tokens: 4096
  max_total_tokens: 50000
  timeout_seconds: 300
exec:
  mode: pure-script
  command: python run.py
  runtime: python311
  runner: local
  inputs: []
  secrets: []
  outputs:
  - name: echo
    kind: file
    media_type: application/json
    path: out/echo.json
    required: true
    label: Echo Response
capabilities:
  secrets: []
  network:
    egress: false
approvals:
  required: false
trigger:
  type: webhook
  webhook:
    secret: true
    allowed_methods:
    - POST
