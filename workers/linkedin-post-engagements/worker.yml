schema_version: "0.3"
archived: true
archive_reason: "Paused — the LinkedIn data provider's quota is used up for now. Resumes automatically on 2026-06-25, or sooner once the data source is topped up."
name: linkedin-post-engagements
title: LinkedIn Post Engagements
description: Pull recent LinkedIn posts from a profile and their public likers via Apify.
long_description: |
  Two-step Apify pipeline: discover recent posts from a LinkedIn profile (datadoping/linkedin-profile-posts-scraper), then extract publicly-visible likers from each post (scraping_solutions/linkedin-posts-engagers-likers-and-commenters-no-cookies). No LinkedIn cookies required; only what's visible to logged-out visitors.

  Outputs a single engagements.json artifact with per-post metadata, the engagers list per post, and a unique-engagers index showing total engagements per person and which posts they engaged with. A summary.md is also written with top posts by engagement count.

  This worker tracks the CURRENT public engagement snapshot. Each scheduled run is a fresh fetch of the latest 20 posts + their likers; cross-run merging is not done in the sandbox (the original ~/.agents/skills/linkedin-post-engagements/data/engagements.json on Federico's Mac handles longitudinal tracking).
use_cases:
- See who liked your recent posts each Tuesday and Friday morning.
- Build a list of repeat engagers to prioritize outreach.
- Track engagement trends per post (likes, comments, reposts).
how_it_works: |
  profile_url + posts_limit
    -> Apify actor datadoping/linkedin-profile-posts-scraper
    -> filter to last 7 days OR all (configurable)
    -> Apify actor scraping_solutions/linkedin-posts-engagers-likers-and-commenters-no-cookies
    -> merge post stats + likers
    -> emit engagements.json + summary.md
folder: Operations
tags:
- linkedin
- engagement
- apify
- scraping
- crm
version: 0.1.0
entrypoint: run.py
targets:
- generic
exec:
  command: python run.py
  runtime: python311
  runner: e2b
  entry: run.py
  inputs:
  - name: profile_url
    kind: scalar
    type: url
    required: true
    default: https://www.linkedin.com/in/fedeponte/
    label: LinkedIn profile URL
    placeholder: https://www.linkedin.com/in/USERNAME/
  - name: posts_limit
    kind: scalar
    type: number
    required: false
    default: 20
    label: Max posts to discover
    placeholder: "20"
  - name: recent_only_days
    kind: scalar
    type: number
    required: false
    default: 7
    label: Only scrape engagement for posts younger than N days (0 = all)
    placeholder: "7"
  outputs:
  - name: engagements
    kind: file
    media_type: application/json
    path: out/engagements.json
    required: true
    label: Engagements snapshot (JSON)
  - name: summary
    kind: file
    media_type: text/markdown
    path: out/summary.md
    required: true
    label: Summary (top posts by engagement)
  secrets:
  - APIFY_API_KEY
capabilities:
  secrets:
  - APIFY_API_KEY
  network:
    egress: true
approvals:
  required: false
trigger:
  type: schedule
  cron: "0 9 * * 2,5"
  timezone: "Europe/Berlin"
