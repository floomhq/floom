schema_version: '0.3'
name: input-types-test
title: Input Types Test
description: Exercises every input type to verify the form renderer.
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
exec:
  command: python run.py
  runtime: python311
  runner: local
  inputs:
  - name: text_input
    kind: scalar
    type: string
    required: true
    label: Text input
    placeholder: Hello
  - name: textarea_input
    kind: scalar
    type: string
    required: false
    label: Textarea input
  - name: number_input
    kind: scalar
    type: number
    required: false
    label: Number input
  - name: select_input
    kind: scalar
    type: select
    required: true
    default: beta
    enum:
    - alpha
    - beta
    - gamma
    label: Select input
    options:
    - alpha
    - beta
    - gamma
  - name: boolean_input
    kind: scalar
    type: boolean
    required: false
    default: false
    label: Boolean (checkbox)
  - name: file_input
    kind: file
    media_type: text/csv
    accepts:
    - text/csv
    - application/octet-stream
    max_size_mb: 1
    path: inputs/file_input
    required: false
    label: File upload
  secrets: []
  outputs:
  - name: summary
    kind: file
    media_type: text/markdown
    path: out/summary.md
    required: true
    label: Summary
  - name: raw_inputs
    kind: file
    media_type: application/json
    path: out/raw_inputs.json
    required: true
    label: Raw inputs
capabilities:
  secrets: []
  files:
  - file_input
  network:
    egress: false
approvals:
  required: false
trigger:
  type: manual
