schema_version: '0.3'
name: csv-enricher
title: CSV Enricher
description: Enriches CSV rows using a custom instruction.
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
exec:
  command: python run.py
  runtime: python311
  runner: local
  inputs:
  - name: csv_text
    kind: scalar
    type: string
    required: true
    label: CSV rows
    placeholder: 'name,company

      Alice,Acme

      Bob,Stark'
  - name: instruction
    kind: scalar
    type: string
    required: true
    label: Enrichment instruction
    placeholder: For each company, infer ICP fit and add a reason.
  secrets:
  - OPENAI_API_KEY
  outputs:
  - name: enriched_csv
    kind: file
    media_type: text/csv
    path: out/enriched_csv.csv
    required: true
    label: Enriched CSV
capabilities:
  secrets:
  - OPENAI_API_KEY
  network:
    egress: true
approvals:
  required: false
trigger:
  type: manual
