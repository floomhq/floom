id: csv_enricher
name: CSV Enricher
description: Enriches CSV rows using a custom instruction.

trigger:
  type: manual

runtime:
  type: python
  entrypoint: run.py
  runner: local

inputs:
  - name: csv_text
    label: CSV rows
    type: textarea
    required: true
    placeholder: "name,company\nAlice,Acme\nBob,Stark"

  - name: instruction
    label: Enrichment instruction
    type: textarea
    required: true
    placeholder: For each company, infer ICP fit and add a reason.

secrets:
  - OPENAI_API_KEY

outputs:
  - name: enriched_csv
    label: Enriched CSV
    type: csv

approvals:
  required: false
