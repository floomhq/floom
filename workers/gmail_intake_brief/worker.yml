schema_version: '0.3'
name: gmail-intake-brief
title: Gmail Intake Brief
description: Fetches recent Gmail messages matching a query and returns a markdown summary.
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
exec:
  command: python run.py
  runtime: python311
  runner: local
  inputs:
  - name: query
    kind: scalar
    type: string
    required: false
    default: is:unread
    label: Gmail search query
    placeholder: e.g. "is:unread label:intake"
  - name: max_results
    kind: scalar
    type: number
    required: false
    default: 5
    label: Max emails to fetch
  secrets:
  - OPENAI_API_KEY
  outputs:
  - name: summary
    kind: file
    media_type: text/markdown
    path: out/summary.md
    required: true
    label: Email summary
capabilities:
  secrets:
  - OPENAI_API_KEY
  network:
    egress: true
approvals:
  required: false
trigger:
  type: manual
connections:
- gmail
