schema_version: '0.3'
is_example: true
name: gmail-intake-brief
title: Gmail Intake Brief
description: Fetches recent Gmail messages matching a query and returns a markdown summary.
long_description: |
  Summarizes recent Gmail messages that match a search query into a concise intake brief. It helps operators turn incoming requests into a triage-ready digest without opening each email manually.
use_cases:
- Summarize unread intake messages before a morning review.
- Pull recruiting leads or client requests from a Gmail label.
- Create a short action list from recent inbound threads.
example_input:
  query: 'is:unread label:intake newer_than:7d'
  max_results: 5
example_output: |
  ## Gmail intake brief

  **5 messages reviewed**

  - Search Assistant client update: Berlin Java role needs two more profiles by Friday.
  - Candidate reply: Anna Keller available for a screening call Wednesday afternoon.
  - Ops request: add CRM export to next reverse-match pass.

  **Next actions:** reply to client, schedule Anna, run CRM match.
how_it_works: |
  Gmail query
    -> fetch matching message metadata and bodies
    -> group related threads
    -> summarize decisions and next actions
    -> return markdown brief
folder: Operations/Inbox
tags:
- gmail
- intake
- summary
- operations
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
limits:
  max_tool_iterations: 12
  max_output_tokens: 12000
  max_total_tokens: 50000
  timeout_seconds: 300
exec:
  command: python run.py
  runtime: python311
  runner: e2b
  inputs:
  - name: query
    kind: scalar
    type: string
    required: false
    default: is:unread
    label: Gmail search query
    placeholder: e.g. "is:unread label:intake"
  - name: max_results
    kind: scalar
    type: number
    required: false
    default: 5
    label: Max emails to fetch
  secrets:
  - OPENAI_API_KEY
  outputs:
  - name: summary
    kind: file
    media_type: text/markdown
    path: out/summary.md
    required: true
    label: Email summary
  entry: run.py
capabilities:
  secrets:
  - OPENAI_API_KEY
  network:
    egress: true
approvals:
  required: false
trigger:
  type: manual
connections:
  - app: gmail
    allowed_tools:
      - GMAIL_FETCH_EMAILS
