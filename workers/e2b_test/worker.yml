schema_version: '0.3'
name: e2b-test
title: E2B Sandbox Test
description: Tests E2B cloud sandbox execution with numpy dependency install.
version: 0.1.0
entrypoint: SKILL.md
targets:
- generic
exec:
  command: python run.py
  runtime: python311
  runner: e2b
  inputs: []
  secrets: []
  outputs:
