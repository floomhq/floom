<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emily – Dock Collapsed</title>
  <link rel="stylesheet" href="_shared.css">
  <style>
    body { overflow: hidden; height: 100vh; }
    /* Placeholder content blocks */
    .content-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .skeleton {
      background: #F1EEE8;
      border-radius: 10px;
      height: 120px;
      border: 1px solid var(--border-soft);
    }
    .skeleton-wide {
      background: #F1EEE8;
      border-radius: 10px;
      height: 60px;
      border: 1px solid var(--border-soft);
      margin-bottom: 10px;
    }
    .skeleton-sm {
      background: #F1EEE8;
      border-radius: 8px;
      height: 40px;
      border: 1px solid var(--border-soft);
      margin-bottom: 8px;
    }
    /* Tooltip on Emily button */
    .emily-fab-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .emily-tooltip {
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 8px;
      white-space: nowrap;
      pointer-events: none;
    }
    .emily-fab-standalone {
      width: 44px;
      height: 44px;
      background: var(--emily-blue);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(89,170,248,0.35), 0 0 0 1px rgba(89,170,248,0.2);
    }
  </style>
</head>
<body>
<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">
        <svg width="16" height="16" viewBox="0 0 100 100" fill="none">
          <path d="M30 22 h20 l22 22 a3 3 0 0 1 0 4 l-22 22 h-20 a6 6 0 0 1 -6 -6 v-36 a6 6 0 0 1 6 -6 z" fill="#FAFAF7"/>
        </svg>
      </div>
      <span class="sidebar-logo-text">Workeros</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" href="#">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="5" height="5" rx="1.2"/><rect x="9.5" y="1.5" width="5" height="5" rx="1.2"/><rect x="1.5" y="9.5" width="5" height="5" rx="1.2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/></svg>
        Overview
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 3V2M11 3V2"/></svg>
        Workers
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12.5V4.5a1 1 0 011-1h10a1 1 0 011 1v8a1 1 0 01-1 1H3a1 1 0 01-1-1z"/><path d="M5 7.5h6M5 10h4"/></svg>
        Contexts
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2 1.5"/></svg>
        Runs
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="8" r="2.5"/><path d="M8.5 8h5M2.5 8H3.5"/><circle cx="10.5" cy="4.5" r="2"/><path d="M8.5 4.5H3"/><circle cx="10.5" cy="11.5" r="2"/><path d="M8.5 11.5H3"/></svg>
        Connections
      </a>
    </nav>
    <div class="sidebar-bottom">
      <a class="nav-item" href="#">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 7v1.5l1 1"/></svg>
        Settings
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-area">
    <div class="page-header-bar">
      <div>
        <div class="page-title">Overview</div>
        <div class="page-subtitle">Your workspace at a glance</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div style="background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:5px 12px;font-size:12.5px;color:var(--text-muted);">workspace-1</div>
      </div>
    </div>
    <div class="page-content">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Workers</div>
          <div class="stat-value">7</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Runs today</div>
          <div class="stat-value">24</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending approvals</div>
          <div class="stat-value" style="color:var(--pending);">3</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Connected apps</div>
          <div class="stat-value">5</div>
        </div>
      </div>
      <div class="content-row">
        <div class="skeleton" style="height:180px;padding:16px;">
          <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:12px;">Recent workers</div>
          <div class="skeleton-sm"></div>
          <div class="skeleton-sm"></div>
          <div class="skeleton-sm" style="opacity:0.5;"></div>
        </div>
        <div class="skeleton" style="height:180px;padding:16px;">
          <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:12px;">Recent runs</div>
          <div class="skeleton-sm"></div>
          <div class="skeleton-sm"></div>
          <div class="skeleton-sm" style="opacity:0.5;"></div>
        </div>
        <div class="skeleton" style="height:180px;padding:16px;">
          <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:12px;">Pending approvals</div>
          <div class="skeleton-sm"></div>
          <div class="skeleton-sm" style="opacity:0.6;"></div>
        </div>
      </div>
      <div class="skeleton-wide"></div>
      <div class="skeleton-wide" style="opacity:0.6;"></div>
    </div>
  </main>
</div>

<!-- Emily FAB -->
<div class="emily-fab-wrap">
  <div class="emily-tooltip">Ask Emily</div>
  <button class="emily-fab-standalone">
    <!-- plain blue circle, no glyph per spec -->
  </button>
</div>
</body>
</html>
