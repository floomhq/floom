<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workeros — FINAL (to spec)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-app:#FBFBFC;--bg-card:#FFFFFF;--bg-2:#F3F4F6;--bg-3:#ECEDF0;--ink:#16171A;--ink-soft:#3a3b40;--muted:#6B7280;--line:rgba(16,17,20,.09);--line-soft:rgba(16,17,20,.055);--primary:#16171A;--success:#2F8F5B;--warning:#E5533D;--pending:#C98A1A;--info:#3E6FE0;--accent:#3E6FE0;--sel:#EEF3FE;--r-card:16px;--r-btn:10px;--r-pill:9999px;--shadow:0 1px 2px rgba(16,17,20,.05),0 1px 3px rgba(16,17,20,.035);}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg-app);color:var(--ink);font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}svg{display:block}
/* thin, quiet scrollbars everywhere (no chunky grey bars) */
*{scrollbar-width:thin;scrollbar-color:rgba(16,17,20,.16) transparent}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(16,17,20,.14);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(16,17,20,.26);background-clip:padding-box}::-webkit-scrollbar-corner{background:transparent}
/* footer icon buttons (theme + settings, next to each other) */
.ufic{color:var(--muted);padding:6px;border-radius:8px;display:flex;flex:0 0 auto}.ufic:hover{background:var(--bg-2);color:var(--ink)}.ufic.sett.on{color:var(--accent);background:var(--sel)}.usr .ufic:first-of-type{margin-left:auto}
.nav.col .usr{flex-direction:column;gap:8px}.nav.col .usr .ufic:first-of-type{margin-left:0}
/* dark mode = mirror palette (the energy day mode was tuned from) */
body.dark{--bg-app:#191A1D;--bg-card:#212327;--bg-2:#292B30;--bg-3:#33363C;--ink:#ECEDEF;--ink-soft:#C8CACF;--muted:#9A9EA6;--line:rgba(255,255,255,.10);--line-soft:rgba(255,255,255,.055);--primary:#ECEDEF;--accent:#5B8DEF;--sel:rgba(91,141,239,.16);--shadow:0 1px 2px rgba(0,0,0,.45)}
body.dark .brand .mark svg{fill:#191A1D}
body.dark .newbtn,body.dark .addbtn,body.dark .btn.primary,body.dark .tag.on,body.dark .nitem .badge,body.dark .einbar .s{color:#191A1D}
body.dark .tag.on{border-color:var(--primary)}body.dark .av{background:#33363C}body.dark .logo{background:#212327}body.dark .code,body.dark .outbox{background:#1c1d21}
.banner{background:#1c1b19;color:#e8e6e1;font-size:12px;padding:6px 16px;text-align:center}.banner b{color:#fff}.banner button{color:#cfc6b8}
.app{display:flex;height:calc(100vh - 28px);overflow:hidden}

/* nav */
.nav{width:228px;flex:0 0 228px;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .16s;overflow:hidden}
.nav.col{width:62px;flex-basis:62px}
.ntop{display:flex;align-items:center;gap:9px;padding:16px 16px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:24px;height:24px;border-radius:7px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ncol{margin-left:auto;color:var(--muted);padding:4px;border-radius:7px}.ncol:hover{background:var(--bg-2)}
.nav.col .brand span:last-child,.nav.col .nitem .t,.nav.col .newbtn .t,.nav.col .nsearch .t,.nav.col .nsearch .k,.nav.col .wsw .m,.nav.col .brand .mark{display:none}
.nav.col .ntop{justify-content:center;padding:16px 0 10px}.nav.col .brand{display:none}.nav.col .ncol{margin:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;background:var(--bg-2);color:var(--ink-soft)}.nav.col .ncol svg{transform:rotate(180deg)}.nav.col .ncol:hover{border-color:var(--accent);color:var(--accent);background:var(--sel)}
.newbtn{margin:6px 14px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border-radius:var(--r-btn);padding:10px;font-weight:500}
.nav.col .newbtn{margin:6px auto;width:38px;padding:10px 0}
.nsearch{margin:0 14px 10px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-btn);padding:7px 10px;color:var(--muted);background:var(--bg-card)}
.nav.col .nsearch{width:38px;margin:0 auto 10px;padding:7px 0;justify-content:center}.nsearch .t{flex:1}.nsearch .k{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.nitems{padding:4px 14px;display:flex;flex-direction:column;gap:1px;flex:1;overflow:auto}.nav.col .nitems{align-items:center;padding:4px 0}
.nitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-btn);color:var(--ink-soft);width:100%;text-align:left}.nav.col .nitem{width:38px;justify-content:center;padding:8px 0}
.nitem svg{width:17px;height:17px;opacity:.7;flex:0 0 auto}.nitem:hover{background:var(--bg-2);color:var(--ink)}.nitem.on{background:var(--sel);color:var(--accent);font-weight:500}.nitem.on svg{opacity:1;color:var(--accent)}
.nitem .badge{margin-left:auto;background:var(--primary);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}.nav.col .nitem .badge{display:none}
.nfoot{border-top:1px solid var(--line);padding:8px 14px 10px}.nav.col .nfoot{padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.sett.nitem{color:var(--ink-soft)}.sett.nitem svg{opacity:.7}.nav.col .sett.nitem{width:38px;justify-content:center;padding:8px 0}
.wsw{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;cursor:pointer}.wsw:hover{background:var(--bg-2)}.nav.col .wsw{padding:0}
.wsw .avs{width:22px;height:22px;border-radius:6px}
.avs{width:26px;height:26px;border-radius:7px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:0 0 auto}
.wsw .m{font-size:12.5px;line-height:1.2}.wsw .m small{display:block;color:var(--muted);font-size:11px}.wsw .c{margin-left:auto;color:var(--muted)}

/* center */
.center{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.cscroll{flex:1;overflow:auto;display:flex;flex-direction:column}
.phead{padding:22px 28px 0}.h1{font-size:23px;font-weight:600;letter-spacing:-.02em}.psub{color:var(--muted);margin-top:2px}
/* global count primitive — same strip below every collection header */
.counts{display:flex;gap:0;align-items:center;padding:10px 28px 0;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.counts .ct{display:flex;align-items:baseline;gap:5px;padding:0 14px;border-right:1px solid var(--line)}
.counts .ct:first-child{padding-left:0}.counts .ct:last-child{border-right:0}
.counts .ct b{color:var(--ink);font-weight:600;font-size:14px}
.usr{display:flex;align-items:center;gap:9px;padding:7px 6px 0;margin-top:2px}.nav.col .usr .m,.nav.col .usr .g{display:none}.nav.col .usr{justify-content:center}
.usr .m{font-size:12.5px;line-height:1.2}.usr .m small{display:block;color:var(--muted);font-size:11px}.usr .g{margin-left:auto;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:10px;padding:14px 28px 0}
.srch{flex:1;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r-btn);padding:10px 13px;color:var(--muted);background:var(--bg-card);max-width:480px}
.srch svg{opacity:.7}
.vtog{display:flex;gap:2px;border:1px solid var(--line);border-radius:var(--r-btn);padding:2px;background:var(--bg-card)}
.vtog button{width:32px;height:28px;border-radius:9px;color:var(--muted);display:flex;align-items:center;justify-content:center}.vtog button.on{background:var(--bg-2);color:var(--ink)}
.addbtn{display:flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border-radius:var(--r-btn);padding:9px 14px;font-weight:500;font-size:13px;white-space:nowrap}
/* tag bar */
.tagbar{display:flex;flex-wrap:nowrap;gap:10px;align-items:center;padding:12px 28px 2px;overflow-x:auto;scrollbar-width:thin}
.tagbar{scrollbar-width:none}.tagbar::-webkit-scrollbar{height:0;display:none}
.tgroup{display:flex;gap:5px;align-items:center;flex:0 0 auto}
.tgroup+.tgroup{padding-left:10px;border-left:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;border-radius:var(--r-pill);padding:3px 10px;font-size:11.5px;color:var(--ink-soft);background:var(--bg-2);white-space:nowrap}
.tag:hover{background:var(--bg-3)}
.tag.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.tag .ico{width:13px;height:13px;display:flex}
.tag .ct{opacity:.55;font-size:11px}

.body{flex:1;min-height:0;display:flex;overflow:hidden;margin-top:14px}
.listcol{flex:1;min-width:0;overflow:auto;padding:0 28px 26px}
.split .listcol{flex:0 0 30%;min-width:210px;border-right:1px solid var(--line);padding:0;display:flex;flex-direction:column;overflow:hidden}
.split.lc .listcol{flex:0 0 46px;min-width:46px;padding:0;overflow:visible}
.split.lc .listcol>.lcin,.split.lc .listcol>.splitbar{display:none}
.sliver{display:none}.split.lc .listcol .sliver{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:14px;color:var(--muted)}
.split .lcin{flex:1;overflow:auto;padding:14px 16px}
.splitbar{display:none}.split .splitbar{display:flex;align-items:center;min-height:64px;padding:0 16px;border-bottom:1px solid var(--line);flex:0 0 auto}.split .splitbar .srch{flex:1;max-width:none}
.detailcol{display:none}.split .detailcol{display:flex;flex:1;min-width:0;flex-direction:column;overflow:hidden}

/* polished list (canonical row, matches real app) */
.ltable{border:0;border-radius:var(--r-card);overflow:hidden;background:transparent}
.lhead{display:grid;gap:14px;padding:9px 18px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:transparent;border-bottom:1px solid var(--line)}
.lrow{display:grid;gap:14px;align-items:center;padding:0 18px;height:64px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.lrow:last-child{border-bottom:0}.lrow:hover{background:var(--bg-2)}.lrow.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.lprimary{display:flex;align-items:center;gap:13px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.logo svg{width:17px;height:17px}
.av{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);background:#EBECF0;font-size:12px;font-weight:600;flex:0 0 auto;border:1px solid var(--line)}
.lp-tx{min-width:0}.lp-tx .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lp-tx .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{color:var(--ink-soft);font-size:12.5px}.cell.m{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);font-size:11.5px;padding:3px 10px;font-weight:500;border:1px solid transparent}
.pill .dot{width:6px;height:6px;border-radius:var(--r-pill);background:currentColor}
.pill.ok{background:rgba(47,143,91,.10);color:#246b45;border-color:rgba(47,143,91,.25)}
.pill.err{background:rgba(249,115,91,.12);color:#a33223;border-color:rgba(249,115,91,.28)}
.pill.warn{background:rgba(224,179,73,.14);color:#8a6d1f;border-color:rgba(224,179,73,.32)}
.pill.run{background:rgba(62,123,208,.12);color:#2c5a8f;border-color:rgba(62,123,208,.28)}
.pill.idle{background:var(--bg-2);color:var(--muted)}
.menu{color:#b6b8bf;text-align:right}
.daygrp .dh{display:flex;align-items:center;padding:16px 4px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}.daygrp .dh .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
/* split-left = the SAME connected list (continuous container + hairline dividers), never floating cards */
.split .listcol .lhead{display:none}
.split .listcol .ltable{border:0;border-radius:0;overflow:hidden;background:transparent}
.split .listcol .lrow{grid-template-columns:1fr!important;height:auto;min-height:58px;padding:13px 14px;border:0;border-bottom:1px solid var(--line-soft);border-radius:0;margin:0;background:none}
.split .listcol .lrow .lprimary{gap:11px}.split .listcol .lrow .lp-tx .sub{margin-top:2px}
.split .listcol .lrow:last-child{border-bottom:0}
.split .listcol .lrow .cell,.split .listcol .lrow .pill,.split .listcol .lrow .menu{display:none}
.split .listcol .lrow.sel{background:var(--bg-2);box-shadow:none}
.split .listcol .daygrp .dh{display:none}

/* grid cards (simplified) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.gcard{border:1px solid var(--line-soft);background:var(--bg-card);border-radius:var(--r-card);padding:15px;display:flex;flex-direction:column;min-height:172px;cursor:pointer;position:relative}
.gcard:hover{border-color:rgba(16,17,20,.18)}.gcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gcard .star{position:absolute;top:13px;right:13px;color:#b6b8bf;opacity:0;transition:opacity .12s}.gcard:hover .star{opacity:1}.gcard .star.on{opacity:1;color:var(--pending)}
.gtop{display:flex;align-items:center;gap:11px}
.gnm{font-weight:500;font-size:15px}.gex{display:inline-block;background:var(--bg-2);color:var(--muted);border-radius:var(--r-pill);font-size:10px;padding:1px 7px;font-weight:500}.gcard .lastrun{color:var(--muted);font-size:11.5px;margin-top:7px;opacity:0;transition:opacity .12s}.gcard:hover .lastrun{opacity:1}
.spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:56px;display:block}.spark path.line{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}.spark path.area{fill:url(#sg);opacity:.7}
.tile{display:flex;flex-direction:column}
.gd{color:var(--muted);font-size:13px;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gfoot{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.gtools{margin-left:auto;display:flex;gap:4px}.gtools .logo{width:18px;height:18px;border-radius:5px}.gtools .logo svg{width:11px;height:11px}

/* detail */
.dhead{display:flex;align-items:center;gap:11px;padding:10px 20px;border-bottom:1px solid var(--line);min-height:64px}
.dhead .lcbtn{color:var(--muted);padding:4px;border-radius:7px}.dhead .lcbtn:hover{background:var(--bg-2)}
.dhead .av,.dhead .logo{width:42px;height:42px}.dhead .logo svg{width:22px;height:22px}
.dh-main{flex:1;min-width:0}.dh-title{display:flex;align-items:center;gap:8px;min-width:0}.dh-title .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vpill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:var(--r-pill);font-size:10.5px;padding:2px 8px;color:var(--muted);background:var(--bg-card);white-space:nowrap;flex:0 0 auto}
.ovf{position:relative}.popover{position:absolute;top:100%;right:0;margin-top:6px;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(16,17,20,.14);padding:5px;min-width:184px;z-index:30}
.popover button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--ink-soft)}.popover button:hover{background:var(--bg-2)}.popover button svg{opacity:.7;width:14px;height:14px}.popover button.del{color:var(--warning)}
.dh-desc{color:var(--muted);font-size:12.5px;margin-top:3px}.dh-sub{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;align-items:center;gap:8px;min-width:0}.dh-sub .desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.dh-apps{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}.dh-apps .logo{width:20px;height:20px;border-radius:6px}.dh-apps .logo svg{width:12px;height:12px}
.dh-act{display:flex;gap:7px;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg-card);border-radius:10px;padding:6px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}.btn:hover{background:var(--bg-2)}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{color:var(--warning);border-color:#f3cabf}.btn.sm{padding:5px 9px;font-size:12px}
.x{color:var(--muted);padding:5px;border-radius:8px}.x:hover{background:var(--bg-2)}
.dtabs{display:flex;gap:2px;padding:7px 16px;border-bottom:1px solid var(--line);overflow:auto}
.dtab{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;color:var(--muted);font-size:13px;white-space:nowrap}.dtab svg{width:14px;height:14px;opacity:.7}.dtab:hover{background:var(--bg-2)}.dtab.on{background:var(--bg-2);color:var(--ink);font-weight:500}.dtab.on svg{opacity:1}.dtab .cb{background:var(--bg-3);color:var(--ink-soft);font-size:10.5px;border-radius:var(--r-pill);padding:0 6px}
.dbody{flex:1;overflow:auto;padding:18px 20px}
.sec{margin-bottom:20px}.sec h4{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 9px;font-weight:600}
.kv{display:grid;grid-template-columns:130px 1fr;gap:9px 16px}.kv .k{color:var(--muted);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 11px;font-size:12.5px;margin:0 6px 6px 0;background:var(--bg-card)}
.code{border:0;border-radius:12px;background:var(--bg-2);color:var(--ink-soft);padding:13px;white-space:pre;overflow:auto;font-size:12px;line-height:1.6}
.outbox{border:0;border-radius:12px;background:var(--bg-2);padding:14px;color:var(--ink-soft)}
.box{border:1px solid var(--line-soft);border-radius:12px;background:var(--bg-2);padding:12px;margin-bottom:9px}.box.row{display:flex;align-items:center;gap:11px}
.flow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border:0;border-radius:14px;background:var(--bg-2);padding:18px}.flow .cap{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;text-align:center}
.fnode{border:1px solid var(--line);border-radius:10px;padding:9px;margin:7px 10px;display:flex;align-items:center;gap:7px;justify-content:center;font-size:12.5px}.fnode.w{border-color:var(--ink);flex-direction:column}
.files{display:flex;gap:14px}.files .ft{flex:0 0 180px;border:1px solid var(--line);border-radius:12px;overflow:hidden;align-self:flex-start}.files .ft .fr{padding:8px 11px;border-bottom:1px solid var(--line-soft);font-size:12.5px;display:flex;gap:8px;align-items:center;cursor:pointer}.files .ft .fr:last-child{border:0}.files .ft .fr.on{background:var(--bg-2)}.files .ft .fr svg{width:13px;opacity:.6}.files .fv{flex:1;min-width:0}
.tl .st{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft)}.tl .st:last-child{border:0}

/* overview */
.pad{padding:0 28px 26px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.tile{border:1px solid var(--line);background:var(--bg-card);border-radius:var(--r-card);padding:16px;position:relative;overflow:hidden;min-height:130px}.tile .v,.tile .l,.tile .c{position:relative;z-index:1}.tile .v{font-size:26px;font-weight:600;letter-spacing:-.02em}.tile .l{font-weight:500;margin-top:4px}.tile .c{color:var(--muted);font-size:12.5px}
.cards2{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;margin-top:18px}.panel{border:0;background:transparent;padding:0}.panel h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between}.panel h3 a{color:var(--muted);font-size:12.5px}

  if(k==='Developer'){const DS=['Token','CLI','MCP','API'];const dseg=`<div class="seg" style="margin-bottom:16px">${DS.map((s,i)=>`<button class="${i===setSub?'on':''}" onclick="setSubTab(${i})">${s}</button>`).join('')}</div>`;const db=setSub===0?`<div class="sec"><h4>Personal access token</h4><div class="box row"><span class="mono" style="flex:1">wos_pat_••••••••••••3f9a</span><button class="btn sm">Reveal</button><button class="btn sm">Rotate</button></div></div>`:setSub===1?`<div class="sec"><h4>CLI</h4><div class="code mono" style="white-space:pre-wrap">npm i -g @floomhq/workeros\nworkeros login\nworkeros run weekly-update</div></div>`:setSub===2?`<div class="sec"><h4>Install into an agent (MCP)</h4><div class="code mono" style="white-space:pre-wrap">{\n  "mcpServers": {\n    "workeros": { "command": "npx", "args": ["-y","@floomhq/workeros","mcp"] }\n  }\n}</div></div>`:`<div class="sec"><h4>API base</h4><div class="code mono">https://workers-api.floom.dev/v1</div></div>`;b=`<h2>Developer access</h2><p class="sd">Drive Workeros from the API, the CLI, or install it into an AI agent over MCP.</p>${dseg}${db}`;}
  else if(k==='System')b=`<h2>System</h2><p class="sd">Workspace defaults applied to every worker.</p><div class="sec"><h4>Workspace</h4><div class="kv"><div class="k">Name</div><div>Floom workspace</div><div class="k">Region</div><div>EU (Frankfurt)</div><div class="k">Timezone</div><div>Europe/Berlin</div></div></div><div class="sec"><h4>Model defaults</h4><div class="kv"><div class="k">Default model</div><div>Claude Opus 4.8</div><div class="k">Fallback</div><div>Claude Sonnet 4.6</div></div></div><div class="sec"><h4>Run limits</h4><div class="kv"><div class="k">Max tokens / run</div><div>4,000</div><div class="k">Timeout</div><div>300s</div><div class="k">Monthly spend cap</div><div>$50</div></div></div>`;
  else if(k==='Channels')b=`<h2>Channels</h2><p class="sd">Where workers reach you and where Emily can be reached. Set once.</p><div class="sec"><h4>Messaging</h4><div class="ltable">${[['slack','Slack','floom.slack.com','y'],['gmail','Email','depontefede@gmail.com','y'],['','WhatsApp','Not connected','n']].map(([brand,nm,acc,st])=>`<div class="lrow" style="grid-template-columns:1fr auto;cursor:pointer"><div class="lprimary">${brand?blogo(brand,17):`<span class="logo">${sv(I.plug,16)}</span>`}<div class="lp-tx"><div class="nm">${nm}</div><div class="sub">${acc}</div></div></div>${st==='n'?'<button class="btn sm">Connect</button>':pill('ok','Connected')}</div>`).join('')}</div></div><div class="sec"><h4>Agent install</h4><p class="sd" style="margin-bottom:8px">Let an external AI agent operate your workers over MCP.</p><div class="code mono">npx -y @floomhq/workeros install</div></div>`;
  else if(k==='Assistant')b=`<h2>Assistant</h2><p class="sd">Configure Emily, your one workspace assistant. Base instructions ship prefilled; workspace instructions start empty.</p><div class="dtabs" style="border-bottom:1px solid var(--line);padding-left:0"><button class="dtab on">Base instructions</button><button class="dtab">Workspace instructions</button><button class="dtab">Final prompt</button><button class="btn sm" style="margin-left:auto">Versions</button></div>${role==='member'?'<div style="font-size:12px;color:var(--warning);margin-top:10px">Member: read-only. Editing the workspace prompt requires Admin.</div>':''}<div style="display:flex;gap:8px;align-items:center;margin:12px 0 8px"><span class="pill idle"><span class="dot"></span>Prefilled by Workeros</span><span class="cell m">v4 · edited 2d ago by federico</span></div><div class="outbox mono" style="white-space:pre-wrap"># Emily\n\nI'm Emily, your chief-of-staff for this Workeros workspace.\n## Character\n- Direct and warm. No em dashes. No emoji unless you use them first.\n- Always confirm before any write action.</div><div class="sec" style="margin-top:16px"><h4>Workspace instructions <span class="cell m" style="text-transform:none;letter-spacing:0">— empty by default</span></h4><div class="outbox" style="color:var(--muted)">No workspace instructions yet. Add tone, rules, or facts specific to your company.</div></div>`;
  else if(k==='Appearance')b=`<h2>Appearance</h2><p class="sd">Theme and accent for this workspace.</p><div class="sec"><h4>Theme</h4><div class="seg"><button class="on">Day</button><button>Dark</button><button>System</button></div></div><div class="sec"><h4>Accent</h4><div style="display:flex;gap:10px;align-items:center"><span style="width:24px;height:24px;border-radius:7px;background:var(--accent);border:1px solid var(--line)"></span><span class="cell">Floom blue</span></div></div>`;
  else if(k==='Members')b=`<h2>Members</h2><p class="sd">People in this workspace. Owners and admins can edit; members get view, feedback and fork.</p>${role==='member'?'<div style="font-size:12px;color:var(--warning);margin-bottom:10px">Member: you can view the team. Inviting requires Admin.</div>':''}<div class="ltable">${[['federico','depontefede@gmail.com','Owner'],['Vivek','vivek@floom.dev','Admin'],['Sam','sam@acme.co','Member']].map(([n,e,r])=>`<div class="lrow" style="grid-template-columns:1fr auto auto;gap:14px"><div class="lprimary">${av(n)}<div class="lp-tx"><div class="nm">${n}</div><div class="sub">${e}</div></div></div><span class="tag" style="padding:2px 9px;font-size:11px">${r}</span>${role==='admin'&&r!=='Owner'?'<button class="btn sm">Manage</button>':'<span style="width:58px"></span>'}</div>`).join('')}</div>${role==='admin'?'<div style="margin-top:12px"><button class="btn primary sm">+ Invite member</button></div>':''}`;
  else b=`<h2>Danger zone</h2><p class="sd">Irreversible actions for this workspace.</p><div class="box row"><div style="flex:1"><div style="font-weight:500">Export all data</div><div class="cell m">Workers, runs, brain, connections metadata.</div></div><button class="btn">Export</button></div><div class="box row"><div style="flex:1"><div style="font-weight:500">Delete workspace</div><div class="cell m">Permanently removes all workers, runs and brain folders.</div></div><button class="btn danger">Delete</button></div>`;
  const listRows=TABS.map((t,i)=>`<div class="lrow ${i===setSel?'sel':''}" style="grid-template-columns:1fr" onclick="setSetTab(${i})"><div class="lprimary"><span class="logo">${sv(I[t[1]]||I.doc,16)}</span><div class="lp-tx"><div class="nm">${t[0]}</div><div class="sub">${t[2]}</div></div></div></div>`).join('');
  const sec=TABS[setSel];
  const shead=`<div class="dhead"><button class="lcbtn" onclick="collapseList()">${sv('<path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/>',18)}</button><span class="logo" style="width:42px;height:42px">${sv(I[sec[1]]||I.doc,22)}</span><div class="dh-main"><div class="dh-title"><span class="nm">${sec[0]}</span></div><div class="dh-sub"><span class="desc">${sec[2]}</span></div></div><div class="dh-act"><button class="x" onclick="backSet()">${sv('<path d="M6 6l12 12M18 6L6 18"/>',16)}</button></div></div>`;
  c.className='cscroll';c.innerHTML=`<div class="phead"><div class="h1">Settings</div><div class="psub">Workspace, channels, assistant, developer access and members.</div></div>
   <div class="body split${(lc||ewide||efull)?' lc':''}">
    <div class="listcol"><div class="sliver">${chev}<button onclick="uncolSmart()" style="color:var(--muted)">»</button></div><div class="splitbar"><div class="srch" style="padding:8px 11px">${sv('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',14)} Search settings…</div></div><div class="lcin"><div class="ltable">${listRows}</div></div></div>
    <div class="detailcol">${shead}<div class="dbody" style="max-width:760px">${b.replace(/^<h2>[^<]*<\/h2>/,'')}</div></div></div>`;return;
 }
 c.innerHTML='';
}
document.addEventListener('click',function(e){let ch=false;if(wmenu&&!e.target.closest('.ovf')){wmenu=false;ch=true;}if(histOpen&&!e.target.closest('.ectrls')){histOpen=false;ch=true;}if(ch)render();});
render();
</script>
