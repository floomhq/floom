<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkerOS — FINAL (to spec)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-app:#FBFBFC;--bg-card:#FFFFFF;--bg-2:#F3F4F6;--bg-3:#ECEDF0;--ink:#16171A;--ink-soft:#3a3b40;--muted:#6B7280;--line:rgba(16,17,20,.09);--line-soft:rgba(16,17,20,.055);--primary:#16171A;--success:#2F8F5B;--warning:#E5533D;--pending:#C98A1A;--info:#3E6FE0;--accent:#3E6FE0;--sel:#EEF3FE;--r-card:16px;--r-btn:10px;--r-pill:9999px;--shadow:none;
/* border system — adjust surfaces globally here, never per-component */
--bd-card:none;        /* cards, tiles, boxes, composer — flat surfaces */
--bd-pill:none;        /* tags, chips, status + meta pills */
--bd-input:none;       /* search + message inputs (bg-2 fill instead) */
--bd-list:none;        /* lists are flat (Cursor-style) — rows separated by dividers only, no outer box */
--bd-div:1px solid var(--line-soft);/* row + section dividers */
--bd-btn:none;         /* secondary buttons are filled (bg-2), not outlined */
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg-app);color:var(--ink);font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}svg{display:block}
/* thin, quiet scrollbars everywhere (no chunky grey bars) */
*{scrollbar-width:thin;scrollbar-color:rgba(16,17,20,.16) transparent}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(16,17,20,.14);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(16,17,20,.26);background-clip:padding-box}::-webkit-scrollbar-corner{background:transparent}
/* footer icon buttons (theme + settings, next to each other) */
.ufic{color:var(--muted);padding:6px;border-radius:8px;display:flex;flex:0 0 auto}.ufic:hover{background:var(--bg-2);color:var(--ink)}.ufic.sett.on{color:var(--accent);background:var(--sel)}.usr .ufic:first-of-type{margin-left:auto}
.nav.col .usr{flex-direction:column;gap:8px}.nav.col .usr .ufic:first-of-type{margin-left:0}
/* dark mode = mirror palette (the energy day mode was tuned from) */
body.dark{--bg-app:#191A1D;--bg-card:#212327;--bg-2:#292B30;--bg-3:#33363C;--ink:#ECEDEF;--ink-soft:#C8CACF;--muted:#9A9EA6;--line:rgba(255,255,255,.10);--line-soft:rgba(255,255,255,.055);--primary:#ECEDEF;--accent:#5B8DEF;--sel:rgba(91,141,239,.16);--shadow:none}
body.dark .brand .mark svg{fill:#FAFAF7}
body.dark .wsico{background:#3a3d44}body.dark .stbrand .wsico{background:#1a1a1a}
body.dark .newbtn,body.dark .addbtn,body.dark .btn.primary,body.dark .tag.on,body.dark .nitem .badge,body.dark .einbar .s{color:#191A1D}
body.dark .tag.on{border-color:var(--primary)}body.dark .av{background:#33363C}body.dark .logo{background:#212327}body.dark .code,body.dark .outbox{background:#1c1d21}
.banner{background:#1c1b19;color:#e8e6e1;font-size:12px;padding:6px 16px;text-align:center}.banner b{color:#fff}.banner button{color:#cfc6b8}
.rseg{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border-radius:7px;padding:2px 5px 2px 10px;font-weight:500}.rseg button{padding:2px 10px;border-radius:5px;color:#cfc6b8;font-weight:600;font-size:12px}.rseg button.on{background:rgba(255,255,255,.22);color:#fff}
.app{display:flex;height:calc(100vh - 28px);overflow:hidden}

/* nav */
.nav{width:228px;flex:0 0 228px;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .16s;overflow:hidden}
.nav.col{width:62px;flex-basis:62px}
.ntop{display:flex;align-items:center;gap:9px;padding:0 16px;height:56px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:24px;height:24px;border-radius:7px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ncol{margin-left:auto;color:var(--muted);padding:4px;border-radius:7px}.ncol:hover{background:var(--bg-2)}
/* top-left = workspace identity (company logo + name), Slack/Notion style */
.ntop .wswrap{flex:1;min-width:0;position:relative}
.wsbrand{display:flex;align-items:center;gap:9px;width:100%;padding:5px 7px;border-radius:9px;color:var(--ink)}.wsbrand:hover{background:var(--bg-2)}
.wsico{width:24px;height:24px;border-radius:7px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.wsico.sm2{width:22px;height:22px;border-radius:6px}
.wsnm{flex:1;text-align:left;font-weight:600;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wsbrand .c{color:var(--muted);flex:0 0 auto;opacity:0;transition:opacity .12s}.wsbrand:hover .c{opacity:1}
#wspop{display:none;left:0;right:0;top:calc(100% + 4px)}#wspop.on{display:block}
.nav.col .ntop .wswrap{flex:0 0 auto}.nav.col .wsbrand{width:auto;padding:5px;justify-content:center}.nav.col .wsnm,.nav.col .wsbrand .c{display:none}.nav.col #wspop{display:none!important}
.nav.col .brand span:last-child,.nav.col .nitem .t,.nav.col .newbtn .t,.nav.col .nsearch .t,.nav.col .nsearch .k,.nav.col .wsw .m,.nav.col .brand .mark{display:none}
.nav.col .ntop{justify-content:center;padding:16px 0 10px}.nav.col .brand{display:none}.nav.col .ncol{margin:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:var(--bg-2);color:var(--ink-soft)}.nav.col .ncol svg{transform:rotate(180deg)}.nav.col .ncol:hover{color:var(--accent);background:var(--sel)}
.newbtn{margin:6px 14px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border-radius:var(--r-btn);padding:10px;font-weight:500}
.nav.col .newbtn{margin:6px auto;width:38px;padding:10px 0}
.acctwrap{position:relative}
.acct{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:9px;color:var(--ink)}.acct:hover{background:var(--bg-2)}.acct .avs{width:28px;height:28px;border-radius:7px}.acct .m{flex:1;text-align:left;font-size:12.5px;line-height:1.2;min-width:0;overflow:hidden}.acct .m small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct .c{color:var(--muted);flex:0 0 auto}
#acctpop{display:none;position:fixed;left:14px;bottom:62px;width:204px;top:auto;right:auto;min-width:0;z-index:60}#acctpop.on{display:block}
.wsitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink-soft)}.wsitem:hover{background:var(--bg-2)}.wsitem .nm{flex:1;font-size:13px}.wsitem.on{color:var(--ink)}.wsitem.on svg{color:var(--accent)}.wsitem svg{opacity:.85;flex:0 0 auto}.avs.sm2{width:24px;height:24px;font-size:10px}
.nav.col .acctwrap{width:36px;margin:0 auto}.nav.col .acct{width:36px;padding:7px 0;justify-content:center}.nav.col .acct .m,.nav.col .acct .c{display:none}.nav.col #acctpop{display:none!important}
.nsearch{margin:0 14px 10px;display:flex;align-items:center;gap:8px;border:0;border-radius:var(--r-btn);padding:7px 10px;color:var(--muted);background:var(--bg-2)}
.nav.col .nsearch{width:38px;margin:0 auto 10px;padding:7px 0;justify-content:center}.nsearch .t{flex:1}.nsearch .k{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.nitems{padding:4px 14px;display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;overflow:auto}.nav.col .nitems{align-items:center;padding:4px 0}
.nfoot{flex:0 0 auto;margin-top:auto;background:var(--bg-app)}
.nitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-btn);color:var(--ink-soft);width:100%;text-align:left}.nav.col .nitem{width:38px;justify-content:center;padding:8px 0}
.nitem svg{width:17px;height:17px;opacity:.7;flex:0 0 auto}.nitem:hover{background:var(--bg-2);color:var(--ink)}.nitem.on{background:var(--sel);color:var(--accent);font-weight:500}.nitem.on svg{opacity:1;color:var(--accent)}
.nitem .badge{margin-left:auto;background:var(--primary);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}.nav.col .nitem .badge{display:none}
.nfoot{border-top:1px solid var(--line);padding:8px 14px 10px}.nav.col .nfoot{padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.sett.nitem{color:var(--ink-soft)}.sett.nitem svg{opacity:.7}.nav.col .sett.nitem{width:38px;justify-content:center;padding:8px 0}
.wsw{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;cursor:pointer}.wsw:hover{background:var(--bg-2)}.nav.col .wsw{padding:0}
.wsw .avs{width:22px;height:22px;border-radius:6px}
.avs{width:26px;height:26px;border-radius:7px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:0 0 auto}
.wsw .m{font-size:12.5px;line-height:1.2}.wsw .m small{display:block;color:var(--muted);font-size:11px}.wsw .c{margin-left:auto;color:var(--muted)}

/* center */
.center{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.cscroll{flex:1;overflow:auto;display:flex;flex-direction:column}
.phead{padding:30px 28px 0}.h1{font-size:23px;font-weight:600;letter-spacing:-.02em}.psub{color:var(--muted);margin-top:2px}
/* global count primitive — same strip below every collection header */
.counts{display:flex;gap:0;align-items:center;padding:10px 28px 0;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.counts .ct{display:flex;align-items:baseline;gap:5px;padding:0 14px;border-right:1px solid var(--line)}
.counts .ct:first-child{padding-left:0}.counts .ct:last-child{border-right:0}
.counts .ct b{color:var(--ink);font-weight:600;font-size:14px}
.usr{display:flex;align-items:center;gap:9px;padding:7px 6px 0;margin-top:2px}.nav.col .usr .m,.nav.col .usr .g{display:none}.nav.col .usr{justify-content:center}
.usr .m{font-size:12.5px;line-height:1.2}.usr .m small{display:block;color:var(--muted);font-size:11px}.usr .g{margin-left:auto;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:10px;padding:14px 28px 0}
.srch{flex:1;display:flex;align-items:center;gap:9px;border:0;border-radius:var(--r-btn);padding:10px 13px;color:var(--muted);background:var(--bg-2);max-width:480px}
.srch svg{opacity:.7}
.vtog{display:flex;gap:2px;border:0;border-radius:var(--r-btn);padding:2px;background:var(--bg-2)}
.vtog button{width:32px;height:28px;border-radius:9px;color:var(--muted);display:flex;align-items:center;justify-content:center}.vtog button.on{background:var(--bg-card);color:var(--ink)}
.addbtn{display:flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border-radius:var(--r-btn);padding:9px 14px;font-weight:500;font-size:13px;white-space:nowrap}
/* tag bar */
.tagbar{display:flex;flex-wrap:nowrap;gap:10px;align-items:center;padding:12px 28px 2px;overflow-x:auto;scrollbar-width:thin;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 44px),transparent)}
.tagbar{scrollbar-width:none}.tagbar::-webkit-scrollbar{height:0;display:none}
.tgroup{display:flex;gap:5px;align-items:center;flex:0 0 auto}
.tgroup+.tgroup{padding-left:10px;border-left:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:5px;border:var(--bd-pill);border-radius:var(--r-pill);padding:3px 10px;font-size:11.5px;color:var(--ink-soft);background:var(--bg-2);white-space:nowrap}
.tag:hover{background:var(--bg-3)}
.tag.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.tag .ico{width:13px;height:13px;display:flex}
.tag .ct{opacity:.55;font-size:11px}

.body{flex:1;min-height:0;display:flex;overflow:hidden;margin-top:14px}
.listcol{flex:1;min-width:0;overflow:auto;padding:0 28px 26px}
.split .listcol{flex:0 0 30%;min-width:210px;border-right:1px solid var(--line);padding:0;display:flex;flex-direction:column;overflow:hidden}
.split.lc .listcol{flex:0 0 46px;min-width:46px;padding:0;overflow:visible}
.split.lc .listcol>.lcin,.split.lc .listcol>.splitbar{display:none}
.sliver{display:none}.split.lc .listcol .sliver{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:14px;color:var(--muted)}
.split .lcin{flex:1;overflow:auto;padding:14px 16px}
.splitbar{display:none}.split .splitbar{display:flex;align-items:center;height:64px;padding:0 16px;border-bottom:1px solid var(--line);flex:0 0 auto}.split .splitbar .srch{flex:1;max-width:none}
.detailcol{display:none}.split .detailcol{display:flex;flex:1;min-width:0;flex-direction:column;overflow:hidden}

/* polished list (canonical row, matches real app) */
.ltable{border:var(--bd-list);border-radius:var(--r-card);overflow:hidden;background:var(--bg-card);box-shadow:var(--shadow)}
.lhead{display:grid;gap:14px;padding:11px 18px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:transparent;border-bottom:var(--bd-div)}
.lrow{display:grid;gap:14px;align-items:center;padding:0 18px;height:64px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.lrow:last-child{border-bottom:0}.lrow:hover{background:var(--bg-2)}.lrow.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.lprimary{display:flex;align-items:center;gap:13px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--bg-2);border:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.logo svg{width:17px;height:17px}
.av{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);background:var(--bg-3);font-size:12px;font-weight:600;flex:0 0 auto;border:0}
.lp-tx{min-width:0}.lp-tx .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lp-tx .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{color:var(--ink-soft);font-size:12.5px}.cell.m{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);font-size:11.5px;padding:3px 10px;font-weight:500;border:1px solid transparent}
.pill .dot{width:6px;height:6px;border-radius:var(--r-pill);background:currentColor}
.pill.ok{background:rgba(47,143,91,.10);color:#246b45;border-color:rgba(47,143,91,.25)}
.pill.err{background:rgba(249,115,91,.12);color:#a33223;border-color:rgba(249,115,91,.28)}
.pill.warn{background:rgba(224,179,73,.14);color:#8a6d1f;border-color:rgba(224,179,73,.32)}
.pill.run{background:rgba(62,123,208,.12);color:#2c5a8f;border-color:rgba(62,123,208,.28)}
.pill.idle{background:var(--bg-2);color:var(--muted)}
.menu{color:#b6b8bf;text-align:right}
.daygrp .dh{display:flex;align-items:center;padding:16px 4px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}.daygrp .dh .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
/* split-left = the SAME connected list (continuous container + hairline dividers), never floating cards */
.split .listcol .lhead{display:none}
.split .listcol .ltable{border:var(--bd-list);border-radius:var(--r-card);overflow:hidden;background:var(--bg-card);box-shadow:none}
.split .listcol .lrow{grid-template-columns:1fr!important;height:auto;min-height:58px;padding:13px 14px;border:0;border-bottom:1px solid var(--line-soft);border-radius:0;margin:0;background:none}
.split .listcol .lrow .lprimary{gap:11px}.split .listcol .lrow .lp-tx .sub{margin-top:2px}
.split .listcol .lrow:last-child{border-bottom:0}
.split .listcol .lrow .cell,.split .listcol .lrow .pill,.split .listcol .lrow .menu{display:none}.sub.lonly{display:none}.split .listcol .sub.lonly{display:block}
.split .listcol .lrow.sel{background:var(--bg-2);box-shadow:none}
.split .listcol .daygrp .dh{display:none}

/* grid cards (simplified) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.gcard{border:var(--bd-card);background:var(--bg-card);border-radius:var(--r-card);padding:15px;display:flex;flex-direction:column;min-height:148px;cursor:pointer;position:relative;box-shadow:var(--shadow);transition:background .12s}
.gcard:hover{background:var(--bg-2)}.gcard.sel{box-shadow:0 0 0 1px var(--accent)}
.gcard .star{position:absolute;top:13px;right:13px;color:#b6b8bf;opacity:0;transition:opacity .12s}.gcard:hover .star{opacity:1}.gcard .star.on{opacity:1;color:var(--pending)}
.gtop{display:flex;align-items:center;gap:11px}
.gnm{font-weight:500;font-size:15px}.gex{display:inline-block;background:var(--bg-2);color:var(--muted);border-radius:var(--r-pill);font-size:10px;padding:1px 7px;font-weight:500}.gcard .lastrun{color:var(--muted);font-size:11.5px;margin-top:7px;opacity:0;transition:opacity .12s}.gcard:hover .lastrun{opacity:1}
.spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:56px;display:block}.spark path.line{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}.spark path.area{fill:url(#sg);opacity:.7}
.tile{display:flex;flex-direction:column}
.gd{color:var(--muted);font-size:13px;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gfoot{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.gtools{margin-left:auto;display:flex;gap:4px}.gtools .logo{width:18px;height:18px;border-radius:5px}.gtools .logo svg{width:11px;height:11px}

/* detail */
.dhead{display:flex;align-items:center;gap:11px;padding:10px 20px;border-bottom:1px solid var(--line);height:64px}
.dhead .lcbtn{color:var(--muted);padding:4px;border-radius:7px}.dhead .lcbtn:hover{background:var(--bg-2)}
.dhead .av,.dhead .logo{width:42px;height:42px}.dhead .logo svg{width:22px;height:22px}
.dh-main{flex:1;min-width:0}.dh-title{display:flex;align-items:center;gap:8px;min-width:0}.dh-title .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vpill{display:inline-flex;align-items:center;gap:5px;border:var(--bd-pill);border-radius:var(--r-pill);font-size:10.5px;padding:2px 8px;color:var(--muted);background:var(--bg-2);white-space:nowrap;flex:0 0 auto}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:var(--bg-2);border-radius:var(--r-pill);padding:2px 8px;white-space:nowrap;flex:0 0 auto}.vbadge svg{width:11px;height:11px;opacity:.75;flex:0 0 auto}
.vbadge.mine{color:var(--ink-soft)}.vbadge.pub{color:var(--info)}.vbadge.pub svg{color:var(--info);opacity:1}
.vbadge.ro{color:var(--warning);background:rgba(229,83,61,.10);margin-left:5px}.vbadge.ro svg{color:var(--warning);opacity:1}
.vico{display:inline-flex;align-items:center;color:var(--muted);opacity:.7;margin-left:6px;flex:0 0 auto}.vico svg{width:13px;height:13px}.vico.pub{color:var(--info);opacity:.95}.vico.mine{color:var(--ink-soft);opacity:.8}
.ovf{position:relative}.popover{position:absolute;top:100%;right:0;margin-top:6px;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(16,17,20,.14);padding:5px;min-width:184px;z-index:30}
.popover button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--ink-soft)}.popover button:hover{background:var(--bg-2)}.popover button svg{opacity:.7;width:14px;height:14px}.popover button.del{color:var(--warning)}

.finp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;color:var(--ink);background:var(--bg-card);outline:none;resize:vertical}.finp:focus{border-color:var(--accent)}
.oauthrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 14px}.oamark{width:42px;height:42px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.oadots{width:46px;border-top:2px dashed var(--line)}
.oscope{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px;color:var(--ink-soft)}.oscope svg{color:var(--success);flex:0 0 auto}
.dxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.dxcard{text-align:left;padding:12px 13px;border-radius:12px;background:var(--bg-2);display:flex;flex-direction:column;gap:3px}.dxcard:hover{background:var(--bg-3)}.dxnm{font-weight:500;font-size:13px;color:var(--ink)}.dxd{font-size:11.5px;color:var(--muted);line-height:1.35}
.agentgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.agentcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:12px;background:var(--bg-2);font-size:12px;color:var(--ink-soft)}.agentcard:hover{background:var(--bg-3)}.agentcard.on{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--ink)}
.alogo{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.alogo svg{width:17px;height:17px;color:#fff;stroke:#fff;opacity:1}
.prow{display:flex;align-items:center;gap:11px;padding:8px 2px}.prow+.prow{border-top:var(--bd-div)}.prow .nm{font-weight:500;font-size:13px}
.plist{max-height:150px;overflow:auto;margin-bottom:4px}
.galbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:12px 0 8px;font-weight:600}
.garow{display:flex;align-items:center;gap:11px}
.csel{display:inline-flex;align-items:center;gap:5px;font-weight:500;font-size:13.5px;color:var(--ink);padding:2px 6px;margin-left:-6px;border-radius:7px}.csel:hover{background:var(--bg-2)}.csel svg{color:var(--muted)}
.vrow{display:flex;align-items:flex-start;gap:11px;padding:11px;border-radius:11px;cursor:pointer}.vrow:hover{background:var(--bg-2)}.vrow.on{background:var(--sel)}.vrow .rdot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;margin-top:1px}.vrow.on .rdot{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--bg-card),inset 0 0 0 6px var(--accent)}.vrow .nm{font-weight:500}.vrow .sub{color:var(--muted);font-size:12px;margin-top:2px}
.chprev{background:var(--bg-2);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:11px}
.chmsg{display:flex;gap:9px}.chmsg .edb{width:28px;height:28px;border-radius:50%;flex:0 0 auto}.chmsg .chbody{font-size:13px;min-width:0}.chname{font-weight:600;font-size:12.5px}.chtime{color:var(--muted);font-weight:400;font-size:11px;margin-left:6px}
.chbtns{display:flex;gap:7px;margin-top:9px}
.qr{width:122px;height:122px;flex:0 0 auto;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px}
.chprev.wa{background:#0b141a;gap:7px}.chprev.wa .wam{align-self:flex-start;background:#202c33;color:#e9edef;border-radius:11px;border-top-left-radius:4px;padding:7px 11px;font-size:12.5px;max-width:82%}.chprev.wa .wame{align-self:flex-end;background:#005c4b;color:#e9edef;border-radius:11px;border-top-right-radius:4px;padding:7px 11px;font-size:12.5px}
/* mobile first-pass: rails auto-collapse (JS), content stacks */
@media (max-width:880px){
 .tiles{grid-template-columns:repeat(2,1fr)}
 .cards2{grid-template-columns:1fr}
 .phead,.toolbar,.counts,.tagbar{padding-left:16px;padding-right:16px}
 .listcol{padding-left:16px;padding-right:16px}.pad{padding-left:16px;padding-right:16px}
 .toolbar{flex-wrap:wrap}.srch{max-width:none;flex-basis:100%}
 .split .listcol{display:none}.split .detailcol{flex:1}
 .grid{grid-template-columns:1fr 1fr}
 .lhead{display:none}.lrow{grid-template-columns:1fr auto!important;gap:8px}.lrow .cell,.lrow .menu{display:none}.lrow .pill{justify-self:end}
 .modal{width:94vw!important}
 .stwrap{padding:20px 14px 40px}
}
@media (max-width:560px){.grid{grid-template-columns:1fr}.tiles{gap:10px}}

 return `<h2>Danger zone</h2><p class="sd">Irreversible actions for this workspace.</p><div class="box row"><div style="flex:1"><div style="font-weight:500">Export all data</div><div class="cell m">Workers, runs, brain, connections metadata.</div></div><button class="btn" onclick="flash(this,'&check; Export started — emailed when ready')">Export</button></div><div class="box row"><div style="flex:1"><div style="font-weight:500">Delete workspace</div><div class="cell m">Permanently removes all workers, runs and brain folders.</div></div><button class="btn danger" onclick="openConfirm('Delete workspace?','Permanently removes all workers, runs and brain folders for everyone. This cannot be undone.','Delete')">Delete</button></div>`;
