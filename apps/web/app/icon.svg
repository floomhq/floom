<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Floom">
  <!-- Floom favicon: dark mark for light UI, light mark for dark UI. -->
  <style>
    rect.bg { fill: #16171A; }
    path.mark { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      rect.bg { fill: #FFFFFF; }
      path.mark { fill: #16171A; }
    }
  </style>
  <rect class="bg" width="100" height="100" rx="22"/>
  <path
    class="mark"
    d="M30 22 h20 l22 22 a3 3 0 0 1 0 4 l-22 22 h-20 a6 6 0 0 1 -6 -6 v-36 a6 6 0 0 1 6 -6 z"
  />
</svg>
