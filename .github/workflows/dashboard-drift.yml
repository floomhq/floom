name: Dashboard drift guard

# Guards against the synced dashboard (web/) silently re-forking from the engine
# UI (engine/apps/web). The engine is a submodule of a SEPARATE private repo
# (github.com/floomhq/workeros).
#
# This runs on the self-hosted AX41 runner (org GitHub-hosted Actions are
# billing-disabled). The private engine submodule is cloned with the runner's
# LOCAL gh credentials (gh auth token) — no stored ENGINE_SUBMODULE_TOKEN secret.
# The runner user has read access to floomhq/workeros, so the drift check ALWAYS
# RUNS FOR REAL and fails the job on any drift. There is no neutral skip.

on:
  pull_request:
    paths:
      - "web/**"
      - "engine"
      - ".gitmodules"
      - ".github/workflows/dashboard-drift.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "engine"
      - ".gitmodules"
      - ".github/workflows/dashboard-drift.yml"

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: [self-hosted, linux, x64, workeros-ci]
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialise engine submodule (runner-local gh auth)
        run: |
          set -euo pipefail
          TOKEN="$(gh auth token)"
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::No gh token available on the self-hosted runner."
            echo "::error::Run 'gh auth login' as the runner user (github-runner)"
            echo "::error::with read access to floomhq/workeros."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          if ! git submodule update --init --recursive; then
            echo "::error::Failed to init the engine submodule with the runner's"
            echo "::error::gh credentials. Check the runner user's read access to"
            echo "::error::floomhq/workeros and the submodule pin."
            exit 1
          fi
          if [ ! -d engine/apps/web ]; then
            echo "::error::engine/apps/web missing after submodule init."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check dashboard is in sync with engine
        working-directory: web
        run: node scripts/check-engine-sync.mjs

      - name: Verify sync script runs cleanly
        working-directory: web
        run: node scripts/sync-engine-web.mjs --quiet
