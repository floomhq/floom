name: Prod Smoke Matrix

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, workeros-ci]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Run prod smoke matrix
        env:
          FLOOM_SECRET: ${{ secrets.FLOOM_SECRET }}
          WORKEROS_API_URL: https://workers-api.floom.dev
        run: python scripts/prod_smoke_matrix.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-matrix-report
          path: docs/workers/SMOKE-RESULTS-*.md
