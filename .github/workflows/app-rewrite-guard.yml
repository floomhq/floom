name: Landing app-route guard

# Durable guard against re-introducing landing /app fall-through regressions.
#
# The landing project must proxy /app/* to the verified dashboard production
# hostname owned by the floomhq dashboard project. Pointing at a dashboard
# hostname that this Vercel team cannot alias freezes /app on stale builds.

on:
  pull_request:
    paths:
      - "vercel.json"
      - "next.config.ts"
      - ".github/workflows/app-rewrite-guard.yml"
  push:
    branches: [main]
    paths:
      - "vercel.json"
      - "next.config.ts"
      - ".github/workflows/app-rewrite-guard.yml"

permissions:
  contents: read

jobs:
  guard:
    name: Verify landing app routes
    # Self-hosted AX41 runner (org GitHub-hosted Actions are billing-disabled).
    runs-on: [self-hosted, linux, x64, workeros-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Assert landing app routes use verified dashboard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys

          canonical = "https://workeros-cloud-dashboard-three.vercel.app"
          stale_fragments = [
              "workeros-cloud-dashboard.vercel.app",
              "r9-detail.floom.dev",
              "web-iota-five-" + "12.vercel.app",
          ]

          with open("vercel.json") as f:
              cfg = json.load(f)

          errors = []
          rewrites = {(r.get("source", ""), r.get("destination", "")) for r in cfg.get("rewrites", [])}
          required_rewrites = {
              ("/app", f"{canonical}/app"),
              ("/app/:path*", f"{canonical}/app/:path*"),
          }
          missing = required_rewrites - rewrites
          for source, dest in sorted(missing):
              errors.append(f"vercel.json missing rewrite {source!r} -> {dest!r}")

          for r in cfg.get("rewrites", []):
              dest = r.get("destination", "")
              for stale in stale_fragments:
                  if stale in dest:
                      errors.append(f"vercel.json still proxies to stale dashboard path {dest!r}")

          next_config = pathlib.Path("next.config.ts").read_text()
          required_fragments = [
              "CLOUD_DASHBOARD_URL",
              canonical,
              'source: "/app"',
              'source: "/app/:path*"',
              'destination: cloudAppDestination("/")',
              'destination: cloudAppDestination("/:path*")',
              "source: `/${route}`",
              "source: `/${route}/:path*`",
              "destination: cloudAppDestination(`/${route}`)",
              "destination: cloudAppDestination(`/${route}/:path*`)",
          ]
          for fragment in required_fragments:
              if fragment not in next_config:
                  errors.append(f"next.config.ts missing routing fragment {fragment!r}")
          for stale in stale_fragments:
              if stale in next_config:
                  errors.append(f"next.config.ts still references stale dashboard {stale!r}")

          if errors:
              print("::error::landing app-route guard failed:")
              for e in errors:
                  print(f"::error::  - {e}")
              sys.exit(1)

          print("OK: landing app routes proxy to the verified dashboard production hostname")
          PY
