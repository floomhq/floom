name: Landing app-route guard

# Durable guard against re-introducing landing /app fall-through regressions.
#
# The landing project must not catch-all rewrite /app/* to another deployment.
# Known app entrypoints are redirected from next.config.ts to NEXT_PUBLIC_APP_URL,
# while unknown /app/* paths fall through to app/not-found.tsx.

on:
  pull_request:
    paths:
      - "vercel.json"
      - "next.config.ts"
      - ".github/workflows/app-rewrite-guard.yml"
  push:
    branches: [main]
    paths:
      - "vercel.json"
      - "next.config.ts"
      - ".github/workflows/app-rewrite-guard.yml"

permissions:
  contents: read

jobs:
  guard:
    name: Verify landing app routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert landing does not proxy /app catch-all
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys

          with open("vercel.json") as f:
              cfg = json.load(f)

          errors = []
          for r in cfg.get("rewrites", []):
              src = r.get("source", "")
              dest = r.get("destination", "")
              if src in {"/app", "/app/:path*"} or src.startswith("/app/"):
                  errors.append(f"vercel.json still rewrites {src!r} to {dest!r}")
              if "workeros-cloud-dashboard.vercel.app/app" in dest:
                  errors.append(f"vercel.json still proxies to stale dashboard path {dest!r}")

          next_config = pathlib.Path("next.config.ts").read_text()
          required_fragments = [
              "NEXT_PUBLIC_APP_URL",
              "https://workers.floom.dev",
              "source: `/app/${route}`",
              "source: `/app/${route}/:path*`",
              "destination: appDestination(`/${route}`)",
              "destination: appDestination(`/${route}/:path*`)",
          ]
          for fragment in required_fragments:
              if fragment not in next_config:
                  errors.append(f"next.config.ts missing routing fragment {fragment!r}")

          if errors:
              print("::error::landing app-route guard failed:")
              for e in errors:
                  print(f"::error::  - {e}")
              sys.exit(1)

          print("OK: landing app routes redirect known app entrypoints and do not catch-all proxy /app/*")
          PY
