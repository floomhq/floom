name: Release

# release-please watches conventional commits on main. On each push it maintains
# a "release vX.Y.Z" PR (changelog + version bump); merging that PR tags the
# commit and creates the GitHub Release. SemVer is derived from commit types
# (fix -> patch, feat -> minor; pre-1.0 keeps breaking changes as minor).
#
# Requires repo/org setting: Settings -> Actions -> General ->
# "Allow GitHub Actions to create and approve pull requests".

# DORMANT until we're ready to start releasing. Today this only runs when
# triggered by hand (Actions tab -> Release -> Run workflow). When stabilized
# and ready to cut releases, switch back to:
#   on:
#     push:
#       branches: [main]
# and merging the auto-opened "release PR" will tag + publish each release.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
