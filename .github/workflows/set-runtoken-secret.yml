name: Set run-token secret parity (one-shot)

# One-shot manual job to fix floomhq/workeros-cloud#636: simple `run:` tokens
# were minted on workeros-cloud-worker and verified on workeros-cloud-api with a
# DIFFERENT signing secret (FLOOM_SECRET is asymmetric across the two services),
# so every script-worker proxy call 401'd. Engine PR floomhq/floom#1932 made both
# mint and verify resolve WORKEROS_RUN_TOKEN_SECRET -> WORKEROS_WORKER_CALL_SECRET
# -> FLOOM_SECRET. This job sets a single shared WORKEROS_RUN_TOKEN_SECRET (first
# in that chain) on BOTH services so they agree. Reuses the existing RAILWAY_TOKEN.
# Does NOT touch FLOOM_SECRET or WORKEROS_WORKER_CALL_SECRET (the wrt_/call_worker
# path is unaffected).

on:
  workflow_dispatch: {}

concurrency:
  group: railway-deploy-main
  cancel-in-progress: false

jobs:
  set-secret:
    name: Align WORKEROS_RUN_TOKEN_SECRET across worker + api
    runs-on: [self-hosted, linux, x64, workeros-ci]
    steps:
      - name: Ensure Railway CLI
        run: |
          set -euo pipefail
          if ! command -v railway >/dev/null 2>&1; then npm i -g @railway/cli; fi
          railway --version

      - name: Set shared run-token secret on both services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is missing."; exit 1
          fi
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          for svc in workeros-cloud-worker workeros-cloud-api; do
            echo "Setting WORKEROS_RUN_TOKEN_SECRET on $svc ..."
            railway variables --set "WORKEROS_RUN_TOKEN_SECRET=$SECRET" --service "$svc"
          done
          echo "Both services now share WORKEROS_RUN_TOKEN_SECRET; Railway will redeploy each."
