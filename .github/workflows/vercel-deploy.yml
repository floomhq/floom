name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-workeros-cloud-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-landing:
    name: Deploy workeros.floom.dev
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WORKEROS_CLOUD_LANDING_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stamp CLI deploy commit
        run: |
          git config user.name "Federico De Ponte"
          git config user.email "depontefede@gmail.com"
          git commit --allow-empty -m "ci: vercel deploy source for ${GITHUB_SHA}"

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          npx --yes vercel@50.22.1 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          timeout 12m npx --yes vercel@50.22.1 deploy --prod --yes --token "$VERCEL_TOKEN"

  deploy-dashboard:
    name: Deploy app dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WORKEROS_CLOUD_DASHBOARD_PROJECT_ID }}

    steps:
      # Do not pass token: ${{ secrets.ENGINE_SUBMODULE_TOKEN }} to checkout — when the
      # secret is unset that becomes an empty string and checkout@v4 fails immediately
      # ("Input required and not supplied: token"). Initialise the private engine
      # submodule manually (same pattern as ci.yml / dashboard-drift.yml).
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialise engine submodule
        id: engine
        env:
          ENGINE_SUBMODULE_TOKEN: ${{ secrets.ENGINE_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ENGINE_SUBMODULE_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ENGINE_SUBMODULE_TOKEN is not set — dashboard deploy will use"
            echo "::warning::the tracked web/ tree without running npm run sync."
            exit 0
          fi
          git config --global \
            url."https://x-access-token:${ENGINE_SUBMODULE_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --depth 1 engine
          if [ ! -d engine/apps/web ]; then
            echo "::error::engine/apps/web missing after submodule init."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync dashboard from engine
        if: steps.engine.outputs.available == 'true'
        working-directory: web
        run: npm run sync -- --quiet

      - name: Stamp CLI deploy commit
        run: |
          git config user.name "Federico De Ponte"
          git config user.email "depontefede@gmail.com"
          git commit --allow-empty -m "ci: vercel deploy source for ${GITHUB_SHA}"

      # Vercel project root is already configured as "web" in the dashboard project
      # settings — run the CLI from the repo root so paths resolve to web/, not web/web.
      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          npx --yes vercel@50.22.1 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          timeout 12m npx --yes vercel@50.22.1 deploy --prod --yes --token "$VERCEL_TOKEN"
