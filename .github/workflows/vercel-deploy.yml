name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-workeros-cloud-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-landing:
    name: Deploy workeros.floom.dev
    # Self-hosted AX41 runner (org GitHub-hosted Actions are billing-disabled).
    runs-on: [self-hosted, linux, x64, workeros-ci]
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WORKEROS_CLOUD_LANDING_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stamp CLI deploy commit
        run: |
          git config user.name "Federico De Ponte"
          git config user.email "depontefede@gmail.com"
          git commit --allow-empty -m "ci: vercel deploy source for ${GITHUB_SHA}"

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          npx --yes vercel@50.22.1 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          timeout 12m npx --yes vercel@50.22.1 deploy --prod --yes --token "$VERCEL_TOKEN"

  deploy-dashboard:
    name: Deploy app dashboard
    # Self-hosted AX41 runner (org GitHub-hosted Actions are billing-disabled).
    runs-on: [self-hosted, linux, x64, workeros-ci]
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WORKEROS_CLOUD_DASHBOARD_PROJECT_ID }}

    steps:
      # The private engine submodule is cloned with the self-hosted runner's
      # local gh credentials (gh auth token), not a stored ENGINE_SUBMODULE_TOKEN
      # secret. Initialise it manually (same pattern as ci.yml / dashboard-drift.yml).
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialise engine submodule (runner-local gh auth)
        run: |
          set -euo pipefail
          TOKEN="$(gh auth token)"
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::No gh token available on the self-hosted runner."
            echo "::error::Run 'gh auth login' as the runner user (github-runner)"
            echo "::error::with read access to floomhq/workeros."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --depth 1 engine
          if [ ! -d engine/apps/web ]; then
            echo "::error::engine/apps/web missing after submodule init."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync dashboard from engine
        working-directory: web
        run: npm run sync -- --quiet

      - name: Stamp CLI deploy commit
        run: |
          git config user.name "Federico De Ponte"
          git config user.email "depontefede@gmail.com"
          git commit --allow-empty -m "ci: vercel deploy source for ${GITHUB_SHA}"

      # Vercel project root is already configured as "web" in the dashboard project
      # settings — run the CLI from the repo root so paths resolve to web/, not web/web.
      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          npx --yes vercel@50.22.1 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          timeout 12m npx --yes vercel@50.22.1 deploy --prod --yes --token "$VERCEL_TOKEN"
