name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-workeros-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-web:
    name: Deploy workers.floom.dev
    runs-on: [self-hosted, linux, x64, workeros-ci]
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WORKEROS_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          # #938: don't leave the GITHUB_TOKEN in .git/config on the
          # self-hosted runner after the job finishes.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stamp CLI deploy commit
        run: |
          git config user.name "Federico De Ponte"
          git config user.email "depontefede@gmail.com"
          git commit --allow-empty -m "ci: vercel deploy source for ${GITHUB_SHA}"

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          npx --yes vercel@50.22.1 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          # workers.floom.dev is a plain production domain on this project, so
          # Vercel auto-promotes this prod deploy to it once it reaches READY.
          npx --yes vercel@50.22.1 deploy --prod --yes --token "$VERCEL_TOKEN" \
            | tee deploy-url.txt
          DEPLOY_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy-url.txt | tail -1)"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Deployed: $DEPLOY_URL"

      - name: Verify workers.floom.dev serves the deploy
        run: |
          set -uo pipefail
          # Catch the historical "sticky alias" gap where a deploy is READY but the
          # custom domain didn't move. Poll the apex until it returns 2xx/3xx.
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://workers.floom.dev/ || echo 000)"
            echo "attempt $i: workers.floom.dev/ -> $code"
            if [[ "$code" =~ ^[23] ]]; then
              echo "workers.floom.dev healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::workers.floom.dev did not return 2xx/3xx after deploy."
          exit 1
