name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-workeros-cloud-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-landing:
    name: Deploy workeros.floom.dev
    # Self-hosted AX41 runner (org GitHub-hosted Actions are billing-disabled).
    runs-on: [self-hosted, linux, x64, workeros-ci]
    timeout-minutes: 15

    env:
      # The apex workeros.floom.dev is owned by the floomhq-team
      # workeros-cloud-landing Vercel project. The repo secrets below MUST resolve
      # to that floomhq project (org id + landing project id). They previously
      # resolved to a personal-team project of the same name, so deploys landed
      # there and only aliased workeros-cloud-landing.vercel.app, never the apex,
      # which froze workeros.floom.dev at a pre-merge build. The pin step below
      # writes .vercel/project.json from these values BEFORE pull so the deploy
      # can never silently auto-link to a same-named project on another team.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WORKEROS_CLOUD_LANDING_PROJECT_ID }}
      VERCEL_LANDING_PROJECT_ID: ${{ secrets.VERCEL_WORKEROS_CLOUD_LANDING_PROJECT_ID }}
      VERCEL_LANDING_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      APEX_DOMAIN: workeros.floom.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stamp CLI deploy commit
        run: |
          git config user.name "Federico De Ponte"
          git config user.email "depontefede@gmail.com"
          git commit --allow-empty -m "ci: vercel deploy source for ${GITHUB_SHA}"

      - name: Pin Vercel project link (floomhq landing)
        run: |
          set -euo pipefail
          # Pin the link BEFORE pull so `vercel pull`/`deploy` target the floomhq
          # project regardless of any stale/personal-team repo secrets. This is
          # the durable guard against the deploy landing in the wrong project.
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "$VERCEL_LANDING_PROJECT_ID" "$VERCEL_LANDING_ORG_ID" > .vercel/project.json
          cat .vercel/project.json

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          npx --yes vercel@50.22.1 pull --yes --environment=production \
            --scope "$VERCEL_LANDING_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          timeout 12m npx --yes vercel@50.22.1 deploy --prod --yes \
            --scope "$VERCEL_LANDING_ORG_ID" --token "$VERCEL_TOKEN" \
            | tee deploy-url.txt
          DEPLOY_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy-url.txt | tail -1)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Could not parse a deploy URL from vercel output."
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Re-alias apex to the new deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Do not rely on Vercel auto-promotion. Resolve the new deploy id and
          # explicitly point the apex at it via the v2 aliases API.
          DEPLOY_ID="$(curl -sS \
            "https://api.vercel.com/v13/deployments/${DEPLOY_URL#https://}?teamId=${VERCEL_LANDING_ORG_ID}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))')"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Could not resolve deploy id for $DEPLOY_URL."
            exit 1
          fi
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          echo "Re-aliasing $APEX_DOMAIN -> $DEPLOY_ID"
          RESP="$(curl -sS -X POST \
            "https://api.vercel.com/v2/deployments/${DEPLOY_ID}/aliases?teamId=${VERCEL_LANDING_ORG_ID}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\":\"${APEX_DOMAIN}\"}")"
          echo "$RESP"
          # Accept success OR the idempotent "already associated" (not_modified) case.
          echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); err=d.get("error") or {}; ok=bool(d.get("uid")) or err.get("code")=="not_modified"; sys.exit(0 if ok else 1)' \
            || { echo "::error::Re-alias of ${APEX_DOMAIN} failed."; exit 1; }

      - name: Verify apex serves the NEW deploy
        run: |
          set -uo pipefail
          # Bare root==2xx is NOT proof: the stale build also served 200, which is
          # exactly how a frozen apex passed before. Assert TWO things until they
          # hold: (1) the apex deployment id matches the deploy we just shipped
          # (via the x-vercel-id header / deployment id), and (2) the FW-03 build
          # marker /v3/integrations returns 200 (it 404s on any build predating
          # the next.config.ts rewrite).
          for i in $(seq 1 30); do
            hdr="$(curl -sS -D - -o /dev/null --max-time 20 "https://${APEX_DOMAIN}/v3/integrations" || true)"
            code="$(printf '%s' "$hdr" | awk 'NR==1{print $2}')"
            served_id="$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-vercel-id"{print $2}')"
            echo "attempt $i: /v3/integrations -> code=$code x-vercel-id=$served_id"
            # x-vercel-id is region::pop-...; the deployment id is not in it, so we
            # gate on the build marker (200) which is unique to this+later builds,
            # then confirm the project's production deploy id equals ours.
            if [ "$code" = "200" ]; then
              proj_id="$(curl -sS \
                "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_LANDING_ORG_ID}" \
                -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                | python3 -c 'import sys,json; d=json.load(sys.stdin); print(((d.get("targets") or {}).get("production") or {}).get("id",""))')"
              echo "project production deploy id: $proj_id (expected ${DEPLOY_ID})"
              if [ "$proj_id" = "$DEPLOY_ID" ]; then
                echo "Apex serves the new deploy ($DEPLOY_ID) and /v3/integrations is 200."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::${APEX_DOMAIN} did not converge to the new deploy (${DEPLOY_ID}) with /v3/integrations==200."
          exit 1

  deploy-dashboard:
    name: Deploy app dashboard
    # Self-hosted AX41 runner (org GitHub-hosted Actions are billing-disabled).
    runs-on: [self-hosted, linux, x64, workeros-ci]
    timeout-minutes: 20

    env:
      # The dashboard apex /app/* is served by the landing project's rewrite to
      # the floomhq workeros-cloud-dashboard project's stable -three alias (see
      # vercel.json / next.config.ts). This job MUST deploy to that floomhq
      # project (team_aOM4ANb5KeVEoKFGTePRK0Wi / prj_K4EXgIgtwjD54fpU2MjjFJ5SLWKT)
      # and re-alias -three to the new deploy. The VERCEL_WORKEROS_CLOUD_DASHBOARD_PROJECT_ID
      # repo secret previously resolved to a same-named PERSONAL-team project
      # (fedes-projects-5891bd50), so prebuilt deploys landed there (and returned
      # 401 behind Vercel SSO), while the floomhq project — and therefore the apex
      # /app — stayed frozen at a pre-merge deploy even though the job reported
      # success. We pin the floomhq org + project id explicitly below (and write
      # .vercel/project.json BEFORE pull) so the deploy can never auto-link to the
      # wrong team's project again.
      DASHBOARD_ORG_ID: team_aOM4ANb5KeVEoKFGTePRK0Wi
      DASHBOARD_PROJECT_ID: prj_K4EXgIgtwjD54fpU2MjjFJ5SLWKT
      DASHBOARD_PROD_ALIAS: workeros-cloud-dashboard-three.vercel.app
      VERCEL_ORG_ID: team_aOM4ANb5KeVEoKFGTePRK0Wi
      VERCEL_PROJECT_ID: prj_K4EXgIgtwjD54fpU2MjjFJ5SLWKT

    steps:
      # The private engine submodule is cloned with the self-hosted runner's
      # local gh credentials (gh auth token), not a stored ENGINE_SUBMODULE_TOKEN
      # secret. Initialise it manually (same pattern as ci.yml / dashboard-drift.yml).
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialise engine submodule (runner-local gh auth)
        run: |
          set -euo pipefail
          TOKEN="$(gh auth token)"
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::No gh token available on the self-hosted runner."
            echo "::error::Run 'gh auth login' as the runner user (github-runner)"
            echo "::error::with read access to floomhq/workeros."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --depth 1 engine
          if [ ! -d engine/apps/web ]; then
            echo "::error::engine/apps/web missing after submodule init."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The dashboard is the engine's apps/web + the cloud overlay, generated by
      # `npm run sync` into web/ (the synced tree is gitignored). Vercel's REMOTE
      # builder cannot reach the root engine/ submodule, so a non-prebuilt
      # `vercel deploy` re-runs `next build` against an incomplete tree and fails.
      # We therefore BUILD ON THE RUNNER (where the synced engine tree exists) and
      # upload only the prebuilt output via `vercel deploy --prebuilt`. This mirrors
      # the proven manual path in docs/CLOUD_FIX_REPORT_2026-06-05.md.
      #
      # IMPORTANT: the dashboard Vercel project has rootDirectory=web, so the
      # vercel CLI must run from the REPO ROOT (it resolves into web/ itself).
      # Running from web/ makes it look for web/web and fail with ENOENT. Only the
      # sync step runs inside web/ (it writes the generated tree there).
      - name: Sync dashboard from engine
        working-directory: web
        run: npm run sync -- --quiet

      - name: Pin Vercel project link (floomhq dashboard)
        run: |
          set -euo pipefail
          # Pin the link BEFORE pull so `vercel pull`/`build`/`deploy` target the
          # floomhq workeros-cloud-dashboard project regardless of any stale/
          # personal-team repo secrets. This is the durable guard against the
          # prebuilt deploy landing in the wrong team's same-named project.
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "$DASHBOARD_PROJECT_ID" "$DASHBOARD_ORG_ID" > .vercel/project.json
          cat .vercel/project.json

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          npx --yes vercel@50.22.1 pull --yes --environment=production \
            --scope "$DASHBOARD_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Build (prebuilt) on runner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          # `vercel build` (run from root, rootDir=web) runs web/'s build script:
          # re-syncs (no-op, detects pre-synced tree) then `next build` with the
          # engine seams baked into web/package.json. Engine source is present on
          # the runner, so it builds a complete tree into .vercel/output.
          timeout 15m npx --yes vercel@50.22.1 build --prod \
            --scope "$DASHBOARD_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          timeout 10m npx --yes vercel@50.22.1 deploy --prebuilt --prod --yes \
            --scope "$DASHBOARD_ORG_ID" --token "$VERCEL_TOKEN" \
            | tee deploy-url.txt
          DEPLOY_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy-url.txt | tail -1)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Could not parse a dashboard deploy URL from vercel output."
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Deployed dashboard: $DEPLOY_URL"

      - name: Re-alias dashboard prod alias to the new deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # The apex /app/* rewrite (vercel.json) serves
          # workeros-cloud-dashboard-three.vercel.app, so the new deploy must own
          # that alias. Do not rely on Vercel auto-promotion (the personal-team
          # project previously "auto-aliased" a same-named domain that the apex
          # never actually served). Resolve the new deploy id and point the alias
          # at it explicitly via the v2 aliases API.
          DEPLOY_ID="$(curl -sS \
            "https://api.vercel.com/v13/deployments/${DEPLOY_URL#https://}?teamId=${DASHBOARD_ORG_ID}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))')"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Could not resolve dashboard deploy id for $DEPLOY_URL."
            exit 1
          fi
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          echo "Re-aliasing $DASHBOARD_PROD_ALIAS -> $DEPLOY_ID"
          RESP="$(curl -sS -X POST \
            "https://api.vercel.com/v2/deployments/${DEPLOY_ID}/aliases?teamId=${DASHBOARD_ORG_ID}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\":\"${DASHBOARD_PROD_ALIAS}\"}")"
          echo "$RESP"
          echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); err=d.get("error") or {}; ok=bool(d.get("uid")) or err.get("code")=="not_modified"; sys.exit(0 if ok else 1)' \
            || { echo "::error::Re-alias of ${DASHBOARD_PROD_ALIAS} failed."; exit 1; }

      - name: Verify dashboard freshness gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          # A green deploy is NOT proof the apex /app advanced: the prior runs were
          # green while the floomhq project stayed frozen. Poll until BOTH hold:
          # (1) the floomhq dashboard project's production deploy id == the deploy
          # we just shipped, and (2) the apex /app/login serves 200 (login screen)
          # from that build.
          for i in $(seq 1 30); do
            proj_id="$(curl -sS \
              "https://api.vercel.com/v9/projects/${DASHBOARD_PROJECT_ID}?teamId=${DASHBOARD_ORG_ID}" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); print(((d.get("targets") or {}).get("production") or {}).get("id",""))')"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://workeros.floom.dev/app/login" || true)"
            echo "attempt $i: floomhq prod id=$proj_id (expected ${DEPLOY_ID}); apex /app/login=$code"
            if [ "$proj_id" = "$DEPLOY_ID" ] && [ "$code" = "200" ]; then
              echo "Dashboard apex /app is fresh: floomhq prod == $DEPLOY_ID and /app/login==200."
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::Dashboard did not converge: floomhq prod ($proj_id) != $DEPLOY_ID or /app/login != 200."
              exit 1
            fi
            sleep 10
          done

      - name: Post-deploy smoke gate (cloud routes via apex)
        run: |
          set -uo pipefail
          # Verify the apex /app rewrite now serves the new dashboard deploy with
          # no 508 route loops / 5xx. Retry to allow the prod alias to propagate.
          for i in $(seq 1 12); do
            if bash ops/smoke-routes.sh cloud; then
              echo "Cloud smoke gate passed."
              exit 0
            fi
            echo "smoke attempt $i failed; retrying after alias propagation..."
            sleep 15
          done
          echo "::error::Cloud smoke gate failed after deploy."
          exit 1
