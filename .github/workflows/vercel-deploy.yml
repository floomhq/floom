name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-workeros-cloud-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-landing:
    name: Deploy floom.dev
    # Self-hosted AX41 runner (org GitHub-hosted Actions are billing-disabled).
    runs-on: [self-hosted, linux, x64, workeros-ci]
    timeout-minutes: 15

    env:
      # The apex floom.dev is owned by the floomhq-team
      # workeros-cloud-landing Vercel project. The repo secrets below MUST resolve
      # to that floomhq project (org id + landing project id). They previously
      # resolved to a personal-team project of the same name, so deploys landed
      # there and only aliased workeros-cloud-landing.vercel.app, never the apex,
      # which froze floom.dev at a pre-merge build. The pin step below
      # writes .vercel/project.json from these values BEFORE pull so the deploy
      # can never silently auto-link to a same-named project on another team.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WORKEROS_CLOUD_LANDING_PROJECT_ID }}
      VERCEL_LANDING_PROJECT_ID: ${{ secrets.VERCEL_WORKEROS_CLOUD_LANDING_PROJECT_ID }}
      VERCEL_LANDING_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      APEX_DOMAIN: floom.dev
      LANDING_ALIASES: floom.dev
      REQUIRED_LANDING_DOMAINS: floom.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stamp CLI deploy commit
        run: |
          git config user.name "Federico De Ponte"
          git config user.email "depontefede@gmail.com"
          git commit --allow-empty -m "ci: vercel deploy source for ${GITHUB_SHA}"

      - name: Pin Vercel project link (floomhq landing)
        run: |
          set -euo pipefail
          # Pin the link BEFORE pull so `vercel pull`/`deploy` target the floomhq
          # project regardless of any stale/personal-team repo secrets. This is
          # the durable guard against the deploy landing in the wrong project.
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "$VERCEL_LANDING_PROJECT_ID" "$VERCEL_LANDING_ORG_ID" > .vercel/project.json
          cat .vercel/project.json

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          npx --yes vercel@50.22.1 pull --yes --environment=production \
            --scope "$VERCEL_LANDING_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          timeout 12m npx --yes vercel@50.22.1 deploy --prod --yes \
            --scope "$VERCEL_LANDING_ORG_ID" --token "$VERCEL_TOKEN" \
            | tee deploy-url.txt
          DEPLOY_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy-url.txt | tail -1)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Could not parse a deploy URL from vercel output."
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Re-alias landing domains to the new deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_ID="$(python3 ops/http-client.py vercel-json-get \
            --url "https://api.vercel.com/v13/deployments/${DEPLOY_URL#https://}?teamId=${VERCEL_LANDING_ORG_ID}" \
            --field id)"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Could not resolve deploy id for $DEPLOY_URL."
            exit 1
          fi
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          chmod +x ops/vercel-ensure-alias.sh
          args=(--team "$VERCEL_LANDING_ORG_ID" --project "$VERCEL_LANDING_PROJECT_ID" --deploy "$DEPLOY_ID")
          IFS=',' read -r -a aliases <<< "$LANDING_ALIASES"
          for alias in "${aliases[@]}"; do
            args+=(--domain "$alias")
          done
          REQUIRED_DOMAINS="$REQUIRED_LANDING_DOMAINS" bash ops/vercel-ensure-alias.sh "${args[@]}"

      - name: Verify apex serves the NEW deploy
        run: |
          set -uo pipefail
          # Bare root==2xx is NOT proof: the stale build also served 200, which is
          # exactly how a frozen apex passed before. Assert TWO things until they
          # hold: (1) the apex deployment id matches the deploy we just shipped
          # (via the x-vercel-id header / deployment id), and (2) the FW-03 build
          # marker /v3/integrations returns 200 (it 404s on any build predating
          # the next.config.ts rewrite).
          for i in $(seq 1 30); do
            code="$(python3 ops/http-client.py status --url "https://${APEX_DOMAIN}/v3/integrations" --timeout 20 || true)"
            echo "attempt $i: /v3/integrations -> code=$code"
            # x-vercel-id is region::pop-...; the deployment id is not in it, so we
            # gate on the build marker (200) which is unique to this+later builds,
            # then confirm the project's production deploy id equals ours.
            if [ "$code" = "200" ]; then
              proj_id="$(python3 ops/http-client.py vercel-json-get \
                --url "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_LANDING_ORG_ID}" \
                --field targets.production.id)"
              echo "project production deploy id: $proj_id (expected ${DEPLOY_ID})"
              if [ "$proj_id" = "$DEPLOY_ID" ]; then
                echo "Apex serves the new deploy ($DEPLOY_ID) and /v3/integrations is 200."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::${APEX_DOMAIN} did not converge to the new deploy (${DEPLOY_ID}) with /v3/integrations==200."
          exit 1

  deploy-dashboard:
    name: Deploy app dashboard
    # Self-hosted AX41 runner (org GitHub-hosted Actions are billing-disabled).
    runs-on: [self-hosted, linux, x64, workeros-ci]
    timeout-minutes: 20

    env:
      # Dashboard lives on the floomhq Vercel team (same org as landing). The
      # landing rewrite points /app/* at r9-detail.floom.dev, which must track
      # this project's production deploy.
      DASHBOARD_SCOPE: ${{ secrets.VERCEL_ORG_ID }}
      DASHBOARD_PROJECT_NAME: workeros-cloud-dashboard
      DASHBOARD_PROJECT_ID_FALLBACK: ${{ secrets.VERCEL_WORKEROS_CLOUD_DASHBOARD_PROJECT_ID }}
      DASHBOARD_PROD_ALIAS: r9-detail.floom.dev

    steps:
      # The private engine submodule is cloned with the self-hosted runner's
      # local gh credentials (gh auth token), not a stored ENGINE_SUBMODULE_TOKEN
      # secret. Initialise it manually (same pattern as ci.yml / dashboard-drift.yml).
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialise engine submodule (runner-local gh auth)
        run: |
          set -euo pipefail
          TOKEN="$(gh auth token)"
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::No gh token available on the self-hosted runner."
            echo "::error::Run 'gh auth login' as the runner user (github-runner)"
            echo "::error::with read access to floomhq/floom."
            exit 1
          fi
          auth_url="https://x-access-token:${TOKEN}"
          github_host="@github.com/"
          git config --global \
            url."${auth_url}${github_host}".insteadOf \
            "https://github.com/"
          git submodule update --init --depth 1 engine
          if [ ! -d engine/apps/web ]; then
            echo "::error::engine/apps/web missing after submodule init."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The dashboard is the engine's apps/web + the cloud overlay, generated by
      # `npm run sync` into web/ (the synced tree is gitignored). Vercel's REMOTE
      # builder cannot reach the root engine/ submodule, so a non-prebuilt
      # `vercel deploy` re-runs `next build` against an incomplete tree and fails.
      # We therefore BUILD ON THE RUNNER (where the synced engine tree exists) and
      # upload only the prebuilt output via `vercel deploy --prebuilt`. This mirrors
      # the proven manual path in docs/CLOUD_FIX_REPORT_2026-06-05.md.
      #
      # Run Vercel from web/ so the dashboard project builds the dashboard package
      # (`web@...`) and not the repo-root landing package (`workeros-cloud@...`).
      # A root build deploys landing rewrites to the dashboard project and leaves
      # /app/* pointing back at the stale r9-detail deployment.
      - name: Sync dashboard from engine
        working-directory: web
        run: npm run sync -- --quiet

      - name: Pin Vercel project link (floomhq dashboard)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Pin the link BEFORE pull so `vercel pull`/`build`/`deploy` target the
          # floomhq workeros-cloud-dashboard project regardless of stale secrets
          # or same-named projects on other teams.
          dashboard_project_id="$(python3 ops/http-client.py vercel-json-get \
            --url "https://api.vercel.com/v9/projects/${DASHBOARD_PROJECT_NAME}?teamId=${DASHBOARD_SCOPE}" \
            --field id)"
          if [ -z "$dashboard_project_id" ] && [ -n "${DASHBOARD_PROJECT_ID_FALLBACK:-}" ]; then
            dashboard_project_id="$(python3 ops/http-client.py vercel-json-get \
              --url "https://api.vercel.com/v9/projects/${DASHBOARD_PROJECT_ID_FALLBACK}?teamId=${DASHBOARD_SCOPE}" \
              --field id)"
          fi
          if [ -z "$dashboard_project_id" ]; then
            echo "::error::Could not resolve ${DASHBOARD_PROJECT_NAME} by name or project-id fallback."
            exit 1
          fi
          echo "DASHBOARD_PROJECT_ID=$dashboard_project_id" >> "$GITHUB_ENV"
          mkdir -p .vercel web/.vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "$dashboard_project_id" "$DASHBOARD_SCOPE" > .vercel/project.json
          cp .vercel/project.json web/.vercel/project.json
          cat .vercel/project.json

      - name: Pull Vercel project settings
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          npx --yes vercel@50.22.1 pull --yes --environment=production \
            --scope "$DASHBOARD_SCOPE" --token "$VERCEL_TOKEN"

      - name: Build (prebuilt) on runner
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          # `vercel build` runs web/'s build script: re-syncs (no-op, detects
          # pre-synced tree) then `next build` with the engine seams baked into
          # web/package.json. Engine source is present on the runner, so it builds
          # a complete dashboard tree into web/.vercel/output.
          timeout 15m npx --yes vercel@50.22.1 build --prod \
            --scope "$DASHBOARD_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          timeout 10m npx --yes vercel@50.22.1 deploy --prebuilt --prod --yes --archive=tgz \
            --scope "$DASHBOARD_SCOPE" --token "$VERCEL_TOKEN" \
            | tee deploy-url.txt
          DEPLOY_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy-url.txt | tail -1)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Could not parse a dashboard deploy URL from vercel output."
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Deployed dashboard: $DEPLOY_URL"

      - name: Re-alias dashboard prod alias to the new deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_ID="$(python3 ops/http-client.py vercel-json-get \
            --url "https://api.vercel.com/v13/deployments/${DEPLOY_URL#https://}?teamId=${DASHBOARD_SCOPE}" \
            --field id)"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Could not resolve dashboard deploy id for $DEPLOY_URL."
            exit 1
          fi
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            state="$(python3 ops/http-client.py vercel-json-get \
              --url "https://api.vercel.com/v13/deployments/${DEPLOY_ID}?teamId=${DASHBOARD_SCOPE}" \
              --field readyState)"
            echo "attempt $i: deploy ${DEPLOY_ID} readyState=${state}"
            if [ "$state" = "READY" ]; then
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::Dashboard deploy ${DEPLOY_ID} never reached READY."
              exit 1
            fi
            sleep 10
          done
          echo "Ensuring $DASHBOARD_PROD_ALIAS aliases $DEPLOY_ID"
          RESP="$(python3 ops/http-client.py vercel-request --method POST \
            --url "https://api.vercel.com/v2/deployments/${DEPLOY_ID}/aliases" \
            --data "{\"alias\":\"${DASHBOARD_PROD_ALIAS}\"}")"
          echo "$RESP"
          ok="$(echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); err=d.get("error") or {}; ok=bool(d.get("uid")) or err.get("code")=="not_modified"; print("1" if ok else "0")')"
          if [[ "$ok" != "1" ]]; then
            RESP="$(python3 ops/http-client.py vercel-request --method POST \
              --url "https://api.vercel.com/v2/deployments/${DEPLOY_ID}/aliases?teamId=${DASHBOARD_SCOPE}" \
              --data "{\"alias\":\"${DASHBOARD_PROD_ALIAS}\"}")"
            echo "fallback (teamId): $RESP"
            echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); err=d.get("error") or {}; ok=bool(d.get("uid")) or err.get("code") in {"not_modified","domain_not_verified"}; sys.exit(0 if ok else 1)' \
              || { echo "::error::Re-alias of ${DASHBOARD_PROD_ALIAS} failed."; exit 1; }
            if echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); sys.exit(0 if (d.get("error") or {}).get("code")=="domain_not_verified" else 1)'; then
              echo "::warning::${DASHBOARD_PROD_ALIAS} is not verified for explicit team alias assignment; continuing because the freshness gate verifies the live /app route."
            fi
          fi

      - name: Verify dashboard freshness gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          # A green deploy is NOT proof the public /app routes advanced. Poll
          # until all hold: (1) the dashboard project's production deploy id is
          # the deploy we just shipped, (2) the public /app/login route serves
          # a login screen without route loops or server errors, and (3) the
          # dashboard alias serves the same Next static chunkset as the immutable
          # deployment URL.
          chunkset_hash() {
            local url="$1" tmp body assets count hash
            tmp="$(mktemp -d)"
            body="$tmp/body.html"
            assets="$tmp/assets.txt"
            if ! python3 ops/http-client.py fetch --url "$url" --output "$body" --timeout 30; then
              rm -rf "$tmp"
              return 1
            fi
            grep -Eo '(/app)?/_next/static/[^"<>[:space:]]+' "$body" \
              | sed -E 's#^/app##; s#[\\]+$##; s#[?].*$##' \
              | sort -u > "$assets" || true
            count="$(wc -l < "$assets" | tr -d ' ')"
            if [ "$count" -eq 0 ]; then
              rm -rf "$tmp"
              return 1
            fi
            hash="$(sha256sum "$assets" | awk '{print $1}')"
            rm -rf "$tmp"
            echo "$hash:$count"
          }
          for i in $(seq 1 30); do
            proj_id="$(python3 ops/http-client.py vercel-json-get \
              --url "https://api.vercel.com/v9/projects/${DASHBOARD_PROJECT_ID}?teamId=${DASHBOARD_SCOPE}" \
              --field targets.production.id)"
            code="$(python3 ops/http-client.py status --url "https://floom.dev/app/login" --timeout 20 || true)"
            deploy_chunk="$(chunkset_hash "${DEPLOY_URL}/app/login" || true)"
            alias_chunk="$(chunkset_hash "https://${DASHBOARD_PROD_ALIAS}/app/login" || true)"
            echo "attempt $i: dashboard prod id=$proj_id (expected ${DEPLOY_ID}); /app/login=$code; deploy chunkset=$deploy_chunk; ${DASHBOARD_PROD_ALIAS} chunkset=$alias_chunk"
            if [ "$proj_id" = "$DEPLOY_ID" ] && [ "$code" = "200" ] && [ -n "$deploy_chunk" ] && [ "$deploy_chunk" = "$alias_chunk" ]; then
              echo "Dashboard /app is fresh: prod == $DEPLOY_ID, /app/login==200, and ${DASHBOARD_PROD_ALIAS} serves the deployed chunkset $deploy_chunk."
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::Dashboard did not converge: prod ($proj_id) != $DEPLOY_ID, /app/login != 200, or ${DASHBOARD_PROD_ALIAS} did not serve the deployed chunkset."
              exit 1
            fi
            sleep 10
          done

      - name: Post-deploy smoke gate (dashboard /app routes)
        run: |
          set -uo pipefail
          # Verify the public /app routes now serve the new dashboard deploy with
          # no 508 route loops / 5xx. Retry to allow the prod alias to propagate.
          for i in $(seq 1 12); do
            if SMOKE_HTTP_CLIENT=python bash ops/smoke-routes.sh dashboard; then
              echo "Dashboard smoke gate passed."
              exit 0
            fi
            echo "smoke attempt $i failed; retrying after alias propagation..."
            sleep 15
          done
          echo "::error::Dashboard smoke gate failed after deploy."
          exit 1
