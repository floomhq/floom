name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-workeros-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-web:
    name: Deploy workers.floom.dev
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WORKEROS_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stamp CLI deploy commit
        run: |
          git config user.name "Federico De Ponte"
          git config user.email "depontefede@gmail.com"
          git commit --allow-empty -m "ci: vercel deploy source for ${GITHUB_SHA}"

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          npx --yes vercel@50.22.1 pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          npx --yes vercel@50.22.1 deploy --prod --yes --token "$VERCEL_TOKEN" | tee /tmp/vercel-deploy.log
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n1)"
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Re-assert production aliases
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF GITHUB_BASE_REF
          sleep 120
          for alias in \
            workers.floom.dev \
            workeros-delta.vercel.app \
            workeros-fedes-projects-5891bd50.vercel.app \
            workeros-depontefede-6377-fedes-projects-5891bd50.vercel.app
          do
            npx --yes vercel@50.22.1 alias set "$DEPLOYMENT_URL" "$alias" --token "$VERCEL_TOKEN"
          done
