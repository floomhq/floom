name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# #938: least-privilege token — CI only reads the repo.
permissions:
  contents: read

jobs:
  api-tests:
    name: API tests (pytest)
    runs-on: [self-hosted, linux, x64, workeros-ci]
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4
        with:
          # #938: don't leave the GITHUB_TOKEN in .git/config on the
          # self-hosted runner after the job finishes.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        env:
          WORKEROS_DEPLOY: local
          WORKEROS_ROOT: ${{ github.workspace }}
          # #938: random per-run values — nothing that pattern-matches a real
          # credential lives in the workflow file or repeats across runs.
          FLOOM_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}
          OPENAI_API_KEY: sk-test-${{ github.run_id }}
        # #604: -p no:warnings keeps output clean; all test files auto-discovered.
        run: pytest tests/ -v --tb=short -p no:warnings

  runtime-tests:
    name: Runtime tests (root pytest suite)
    runs-on: [self-hosted, linux, x64, workeros-ci]

    steps:
      - uses: actions/checkout@v4
        with:
          # #938: don't leave the GITHUB_TOKEN in .git/config on the
          # self-hosted runner after the job finishes.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt pytest pytest-asyncio

      - name: Run root runtime tests
        env:
          WORKEROS_DEPLOY: local
          WORKEROS_ROOT: ${{ github.workspace }}
          # #938: random per-run values — nothing that pattern-matches a real
          # credential lives in the workflow file or repeats across runs.
          FLOOM_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}
          OPENAI_API_KEY: sk-test-${{ github.run_id }}
        # #604: root pytest.ini points at tests/ (66 files). These cover the
        # full worker runtime — agent driver, E2B sandbox, run orchestration —
        # and were previously not run in CI.
        run: pytest tests/ -v --tb=short -p no:warnings

  web-tests:
    name: Web tests (vitest + tsx + lint)
    runs-on: [self-hosted, linux, x64, workeros-ci]
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
        with:
          # #938: don't leave the GITHUB_TOKEN in .git/config on the
          # self-hosted runner after the job finishes.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Unit tests (tsx — source-inspection suite)
        # #604: tsx-style tests check structural source properties and can't
        # run via vitest (no describe blocks).
        run: |
          for f in tests/fl-*.test.ts tests/strip-citations.test.ts; do
            if grep -q 'from "vitest"' "$f"; then
              continue
            fi
            npx tsx "$f" || exit 1
          done

  mcp-tests:
    name: MCP package tests
    runs-on: [self-hosted, linux, x64, workeros-ci]
    defaults:
      run:
        working-directory: apps/mcp

    steps:
      - uses: actions/checkout@v4
        with:
          # #938: don't leave the GITHUB_TOKEN in .git/config on the
          # self-hosted runner after the job finishes.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
