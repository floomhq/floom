name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        env:
          WORKEROS_DEPLOY: local
          FLOOM_SECRET: ci-test-secret
          OPENAI_API_KEY: ""
        # #604: -p no:warnings keeps output clean; all test files auto-discovered.
        run: pytest tests/ -v --tb=short -p no:warnings

  runtime-tests:
    name: Runtime tests (root pytest suite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt pytest pytest-asyncio

      - name: Run root runtime tests
        env:
          WORKEROS_DEPLOY: local
          FLOOM_SECRET: ci-test-secret
          OPENAI_API_KEY: ""
        # #604: root pytest.ini points at tests/ (66 files). These cover the
        # full worker runtime — agent driver, E2B sandbox, run orchestration —
        # and were previously not run in CI.
        run: pytest tests/ -v --tb=short -p no:warnings

  web-tests:
    name: Web tests (vitest + tsx + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Unit tests (tsx — source-inspection suite)
        # #604: tsx-style tests check structural source properties and can't
        # run via vitest (no describe blocks).
        run: |
          for f in tests/fl-*.test.ts tests/strip-citations.test.ts; do
            npx tsx "$f" || exit 1
          done

  mcp-tests:
    name: MCP package tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
