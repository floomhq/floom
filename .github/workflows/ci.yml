name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cloud-tests:
    name: Cloud tests (pytest)
    # Self-hosted AX41 runner (org GitHub-hosted Actions are billing-disabled).
    runs-on: [self-hosted, linux, x64, workeros-ci]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialise engine submodule (runner-local gh auth)
        # The private engine submodule (floomhq/floom) is cloned with the
        # self-hosted runner's local gh credentials (gh auth token), not a
        # stored ENGINE_SUBMODULE_TOKEN secret. The runner user is logged in to
        # gh with read access to floomhq/floom, so this ALWAYS runs for real
        # on the self-hosted runner — no neutral skip.
        run: |
          set -euo pipefail
          TOKEN="$(gh auth token)"
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::No gh token available on the self-hosted runner."
            echo "::error::Run 'gh auth login' as the runner user (github-runner)"
            echo "::error::with read access to floomhq/floom."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --recursive
          if [ ! -d engine/apps/api ]; then
            echo "::error::engine/apps/api missing after submodule init."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt pytest pytest-asyncio

      - name: Run cloud tests
        env:
          WORKEROS_DEPLOY: cloud
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          # Valid 32-byte url-safe base64 Fernet key for CI only (base64 of the
          # readable string "workeros-cloud-ci-test-key-32byt"). The previous
          # placeholder was not valid base64, so startup's Fernet init raised at
          # import time. This was masked while the whole job neutral-skipped (no
          # ENGINE_SUBMODULE_TOKEN); it surfaced once the suite actually runs.
          WORKEROS_CLOUD_SECRETS_ENCRYPTION_KEY: d29ya2Vyb3MtY2xvdWQtY2ktdGVzdC1rZXktMzJieXQ=
        run: pytest tests/ -v --tb=short

      - name: Install engine dependencies
        run: pip install -r engine/apps/api/requirements.txt

      - name: Run engine tests
        working-directory: engine
        env:
          WORKEROS_DB: ${{ runner.temp }}/workeros-engine-ci.db
          FLOOM_DB: ${{ runner.temp }}/workeros-engine-ci.db
          FLOOM_WORKERS_DIR: ${{ runner.temp }}/workeros-engine-workers
          FLOOM_CONTEXTS_DIR: ${{ runner.temp }}/workeros-engine-contexts
          FLOOM_ARTIFACTS_DIR: ${{ runner.temp }}/workeros-engine-artifacts
          WORKEROS_GITHUB_PAT_ENCRYPTION_SECRET: ci-github-pat-secret
          WORKEROS_CLOUD_SECRETS_ENCRYPTION_KEY: d29ya2Vyb3MtY2xvdWQtY2ktdGVzdC1rZXktMzJieXQ=
        run: python -m pytest -q
