name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.15.17
      - name: Ruff check
        run: ruff check .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --no-banner --redact

  runtime-tests:
    name: Runtime tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r apps/api/requirements.txt pytest pytest-asyncio pytest-xdist
      - name: Collect tests
        env:
          WORKEROS_DEPLOY: local
          WORKEROS_ROOT: ${{ github.workspace }}
          FLOOM_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}
          OPENAI_API_KEY: sk-test-${{ github.run_id }}
          COMPOSIO_API_KEY: ci-test-composio-${{ github.run_id }}
        run: python -m pytest tests/ --collect-only -q -p no:warnings
      - name: Run tests
        env:
          WORKEROS_DEPLOY: local
          WORKEROS_ROOT: ${{ github.workspace }}
          FLOOM_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}
          OPENAI_API_KEY: sk-test-${{ github.run_id }}
          COMPOSIO_API_KEY: ci-test-composio-${{ github.run_id }}
        run: python -m pytest tests/ -v --tb=short -p no:warnings -n auto --dist loadscope

  web-lint:
    name: Web lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Em-dash guard
        run: npm run lint:emdash
      - name: Unit tests
        run: npm test

  mcp-tests:
    name: MCP tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
