name: Dump worker scheduler logs (diagnostic)

on:
  workflow_dispatch: {}

concurrency:
  group: railway-deploy-main
  cancel-in-progress: false

jobs:
  logs:
    name: Capture workeros-cloud-worker scheduler logs
    runs-on: [self-hosted, linux, x64, workeros-ci]
    steps:
      - name: Ensure Railway CLI
        run: |
          set -euo pipefail
          if ! command -v railway >/dev/null 2>&1; then npm i -g @railway/cli; fi
          railway --version
      - name: Dump + filter logs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail
          echo "=== worker logs (scheduler-relevant) ==="
          timeout 30 railway logs --service workeros-cloud-worker > /tmp/wlogs.txt 2>&1 || true
          echo "--- matches ---"
          grep -iE "scheduler|advisory|Schedule trigger-row|Scheduler tick failed|Cloud scheduler|Traceback|ModuleNotFound|ImportError|AttributeError|NameError|Error" /tmp/wlogs.txt | tail -60 || echo "(no matches)"
          echo "=== last 40 raw lines ==="
          tail -40 /tmp/wlogs.txt || true
