<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Floom">
  <!--
    Floom app icon. iOS-style rounded square (dark) with the cream brand
    play-arrow. Source for apple-touch-icon (180x180) and the maskable PWA
    icon. Corner radius 22% matches the iOS icon template. No green.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#0E0E0E"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="180" height="180" rx="40" ry="40" fill="url(#bg)"/>
  <rect x="0" y="0" width="180" height="180" rx="40" ry="40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <g transform="translate(20, 20) scale(1.4)">
    <path
      d="M32 26 h20 l22 22 a3 3 0 0 1 0 4 l-22 22 h-20 a6 6 0 0 1 -6 -6 v-36 a6 6 0 0 1 6 -6 z"
      fill="#FAFAF7"
    />
  </g>
</svg>
